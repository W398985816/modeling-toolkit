<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镂空生成器</title>
  <style>
    :root {
      --ink: #142224;
      --paper: #f6f4ee;
      --panel: #ffffff;
      --line: #d7ded8;
      --muted: #61706d;
      --accent: #11998f;
      --accent-dark: #087a73;
      --base: #eadfc1;
      --wire: #101f20;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(17,153,143,0.10), rgba(214,164,77,0.12)),
        var(--paper);
    }

    button, input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,0.88);
    }

    .drop-zone {
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px dashed #9fb6b2;
      border-radius: 8px;
      background: #fbfdfb;
    }

    .drop-zone.dragging {
      border-color: var(--accent);
      background: rgba(17,153,143,0.08);
    }

    .file-input { display: none; }

    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 7px;
      color: #fff;
      background: var(--ink);
      font-weight: 700;
    }

    .file-name {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sampling-warning {
      color: #a24b13;
      font-size: 11px;
      line-height: 1.5;
    }

    .sampling-warning[hidden] { display: none; }

    .hollow-note {
      display: grid;
      gap: 3px;
      padding: 10px 12px;
      border-left: 3px solid var(--accent);
      border-radius: 0 7px 7px 0;
      color: var(--muted);
      background: rgba(17,153,143,0.07);
      font-size: 11px;
      line-height: 1.5;
    }

    .hollow-note strong {
      color: var(--accent-dark);
      font-size: 12px;
    }

    .color-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 5px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border: 1px solid rgba(20,34,36,0.25);
      border-radius: 3px;
    }

    .legend-swatch.solid { background: var(--base); }
    .legend-swatch.cutout { background: var(--wire); }
    .legend-swatch.island { background: #da362f; }

    .advanced-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 800;
    }

    .advanced-toggle span { transition: transform 160ms ease; }
    .show-advanced .advanced-toggle span { transform: rotate(180deg); }
    .advanced-only { display: none !important; }
    .show-advanced .advanced-only { display: grid !important; }

    .section {
      display: grid;
      gap: 10px;
    }

    .section-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .control {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .control[data-tip], .toggle[data-tip] {
      position: relative;
    }

    .control[data-tip]::after, .toggle[data-tip]::after {
      position: absolute;
      z-index: 20;
      left: 10px;
      top: calc(100% + 6px);
      width: min(250px, calc(100vw - 42px));
      padding: 8px 10px;
      border: 1px solid rgba(16, 31, 32, 0.16);
      border-radius: 6px;
      color: #fff;
      background: rgba(16, 31, 32, 0.94);
      box-shadow: 0 8px 20px rgba(16, 31, 32, 0.2);
      content: attr(data-tip);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .control[data-tip]:hover, .control[data-tip]:focus-within,
    .toggle[data-tip]:hover, .toggle[data-tip]:focus-within {
      z-index: 2;
    }

    .control[data-tip]:hover::after, .control[data-tip]:focus-within::after,
    .toggle[data-tip]:hover::after, .toggle[data-tip]:focus-within::after {
      opacity: 1;
      transform: translateY(0);
    }

    .control-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .number-input {
      width: 80px;
      min-width: 0;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--accent-dark);
      background: #fff;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .number-input:focus {
      border-color: rgba(17,153,143,0.6);
      box-shadow: 0 0 0 3px rgba(17,153,143,0.12);
      outline: none;
    }

    .mode-select {
      min-width: 132px;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--accent-dark);
      background: #fff;
      font: inherit;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-size: 13px;
    }

    .toggle input {
      width: 42px;
      height: 24px;
      margin: 0;
      accent-color: var(--accent);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .export-format {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
      font-weight: 800;
    }

    .export-format .mode-select { width: 100%; }

    .printability-panel {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfa;
    }

    .printability-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .printability-header strong { font-size: 13px; }

    .printability-badge {
      padding: 4px 7px;
      border-radius: 999px;
      color: #35645f;
      background: #dff3ee;
      font-size: 10px;
      font-weight: 900;
    }

    .printability-badge.warning { color: #8a4c13; background: #fff0d9; }
    .printability-badge.danger { color: #a52d29; background: #fde5e3; }

    .printability-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .printability-list li {
      display: grid;
      grid-template-columns: 8px 1fr;
      gap: 7px;
      align-items: start;
    }

    .printability-list li::before {
      width: 7px;
      height: 7px;
      margin-top: 4px;
      border-radius: 50%;
      background: #69a89f;
      content: "";
    }

    .printability-list li.warning::before { background: #d68128; }
    .printability-list li.danger::before { background: #d33b34; }

    .island-actions {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 6px;
      align-items: center;
      padding-top: 9px;
      border-top: 1px solid var(--line);
    }

    .island-actions button {
      min-height: 30px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    .island-actions .auto-bridge-button {
      grid-column: 1 / 3;
      color: #fff;
      background: var(--accent-dark);
    }

    .island-actions .delete-island-button {
      grid-column: 3;
      color: #a52d29;
      border-color: #e8bbb7;
      background: #fff7f6;
    }

    .island-counter {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }

    .bridge-confirm-actions {
      display: flex;
      gap: 6px;
      grid-column: 1 / -1;
    }

    .bridge-confirm-actions button { flex: 1; }
    .bridge-confirm-actions .confirm { color: #fff; background: var(--accent); }

    .primary-button, .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 800;
    }

    .primary-button {
      color: #fff;
      background: var(--accent);
    }

    .secondary-button {
      color: var(--ink);
      background: #f2f5f2;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status {
      display: grid;
      gap: 8px;
      margin-top: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fbfcfa;
      font-size: 12px;
      line-height: 1.5;
    }

    .workspace {
      position: sticky;
      top: 0;
      align-self: start;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      height: 100vh;
      max-height: 100vh;
      padding: 24px;
      min-width: 0;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .tabs {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.8);
    }

    .tab {
      min-width: 74px;
      padding: 9px 14px;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
    }

    .tab.active {
      color: #fff;
      background: var(--ink);
    }

    .metric-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .line-editor {
      display: flex;
      flex: 1 1 460px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.78);
    }

    .line-editor[hidden] { display: none; }

    .editor-tool,
    .editor-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
    }

    .editor-tool svg,
    .editor-action svg { width: 15px; height: 15px; }

    .editor-tool:hover,
    .editor-action:hover { background: #f1f5f2; }

    .editor-tool.active {
      border-color: rgba(17,153,143,0.28);
      color: #fff;
      background: var(--accent-dark);
    }

    .editor-action:disabled { opacity: 0.45; }

    .editor-size {
      display: grid;
      grid-template-columns: auto 52px minmax(72px, 112px);
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 7px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .editor-size input[type="number"] {
      width: 52px;
      min-width: 0;
      padding: 4px 5px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--accent-dark);
      background: #fff;
      text-align: right;
    }

    .editor-size input[type="range"] { min-width: 72px; }

    .metric {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(255,255,255,0.78);
      font-size: 12px;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      overflow: hidden;
      min-height: 0;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(45deg, rgba(20,34,36,0.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(20,34,36,0.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(20,34,36,0.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(20,34,36,0.035) 75%),
        #fff;
      background-size: 26px 26px;
      background-position: 0 0, 0 13px, 13px -13px, -13px 0;
      cursor: grab;
    }

    .stage.with-stl {
      grid-template-columns: minmax(0, 1fr) minmax(320px, 42%);
      gap: 12px;
      padding: 12px;
    }

    .stage.dragging { cursor: grabbing; }

    .stage.editing { cursor: crosshair; }

    .preview-pane,
    .stl-pane {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: 8px;
    }

    .preview-pane {
      background: rgba(255,255,255,0.42);
    }

    .preview-zoom {
      position: absolute;
      z-index: 4;
      top: 12px;
      right: 12px;
      display: grid;
      gap: 5px;
      padding: 5px;
      border: 1px solid rgba(20,34,36,0.14);
      border-radius: 8px;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 6px 18px rgba(20,34,36,0.12);
    }

    .preview-zoom button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
    }

    .preview-zoom button:hover { background: #edf4f1; }
    .preview-zoom svg { width: 17px; height: 17px; }

    .stl-pane {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid rgba(20,34,36,0.12);
      background:
        radial-gradient(circle at 35% 18%, rgba(255,255,255,0.96), rgba(247,244,235,0.92) 48%, rgba(232,224,204,0.88));
      cursor: grab;
    }

    .stl-pane.dragging { cursor: grabbing; }

    .stl-pane[hidden] { display: none; }

    .stl-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-bottom: 1px solid rgba(20,34,36,0.1);
      color: var(--muted);
      background: rgba(255,255,255,0.62);
      font-size: 12px;
      font-weight: 700;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      color: var(--ink);
      background: rgba(255,255,255,0.78);
    }

    .icon-button:hover {
      background: #fff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .toast {
      position: absolute;
      right: 18px;
      bottom: 18px;
      max-width: 320px;
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(20,34,36,0.92);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
      font-size: 13px;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .workspace {
        position: static;
        height: auto;
        max-height: none;
        min-height: 62vh;
        overflow: visible;
      }

      .line-editor { order: 3; width: 100%; }
      .editor-size { border-left: 0; }
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }
      .tabs, .metric-strip { width: 100%; }
      .metric-strip { justify-content: flex-start; }
      .tab { min-width: 0; }
      .stage {
        height: min(70vh, 680px);
        min-height: 420px;
      }
      .stage.with-stl { grid-template-columns: 1fr; }
      .stl-pane { min-height: 360px; }
    }

    /* Workspace redesign: a calmer, production-oriented layout. */
    :root {
      --ink: #17272b;
      --paper: #f4f7f8;
      --panel: #ffffff;
      --line: #e3eaec;
      --muted: #5f7077;
      --accent: #087f78;
      --accent-dark: #066861;
      --soft-teal: #e8f6f4;
      --shadow: 0 8px 26px rgba(26, 47, 54, 0.06);
      --sidebar-width: 344px;
      --preview-width: 38%;
    }

    body {
      overflow: hidden;
      background: var(--paper);
      font-family: "PingFang SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    }

    :where(button, input, select, [tabindex]):focus-visible {
      outline: 3px solid rgba(8, 127, 120, 0.28);
      outline-offset: 2px;
    }

    body.resizing-panels,
    body.resizing-panels * {
      cursor: col-resize !important;
      user-select: none !important;
    }

    .application-shell {
      display: grid;
      grid-template-rows: 72px minmax(0, 1fr);
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(31, 157, 145, 0.06), transparent 30%),
        var(--paper);
    }

    .app-header {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto minmax(260px, 1fr);
      align-items: center;
      gap: 28px;
      padding: 0 30px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 1px 0 rgba(16, 31, 32, 0.02);
    }

    .header-brand,
    .project-status,
    .header-meta {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .header-brand { gap: 11px; }

    .header-brand strong {
      display: block;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.2;
    }

    .header-brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .project-status {
      justify-content: center;
      gap: 13px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .save-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
    }

    .save-state::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ab79f;
      box-shadow: 0 0 0 4px rgba(42, 183, 159, 0.12);
      content: "";
    }

    .save-state[data-tone="neutral"] { color: var(--muted); }
    .save-state[data-tone="neutral"]::before { background: #91a2a6; box-shadow: 0 0 0 4px rgba(113, 128, 135, 0.12); }
    .save-state[data-tone="warning"] { color: #98530f; }
    .save-state[data-tone="warning"]::before { background: #d68128; box-shadow: 0 0 0 4px rgba(214, 129, 40, 0.13); }
    .save-state[data-tone="danger"] { color: #a52828; }
    .save-state[data-tone="danger"]::before { background: #d33b34; box-shadow: 0 0 0 4px rgba(211, 59, 52, 0.12); }

    .header-meta {
      justify-content: flex-end;
      gap: 9px;
    }

    .header-chip {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .app {
      grid-template-columns: var(--sidebar-width) 10px minmax(0, 1fr);
      min-height: 0;
      height: calc(100vh - 72px);
    }

    .sidebar {
      grid-column: 1;
      display: block;
      min-height: 0;
      padding: 10px 12px 22px;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      scrollbar-color: #cbd8da transparent;
    }

    .workspace { grid-column: 3; }

    .panel-splitter {
      position: relative;
      z-index: 12;
      min-width: 10px;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
    }

    .panel-splitter::after {
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: 4px;
      width: 2px;
      border-radius: 2px;
      background: #d6e2e3;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.65);
      content: "";
      transition: background 0.16s ease, box-shadow 0.16s ease;
    }

    .panel-splitter:hover::after,
    .panel-splitter.dragging::after {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 151, 141, 0.12);
    }

    .sidebar-splitter { grid-column: 2; }


    .sidebar .drop-zone {
      display: grid;
      min-height: 94px;
      margin: 8px 4px 12px;
      padding: 16px;
      border: 1px dashed #b9ced0;
      border-radius: 9px;
      background: #fbfefe;
      text-align: center;
    }

    .sidebar .upload-button {
      width: 100%;
      min-height: 40px;
      border-radius: 7px;
      color: var(--ink);
      background: #f3f8f8;
      font-size: 13px;
    }

    .sidebar .file-name {
      padding: 0 4px;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
    }

    .section {
      gap: 0;
      margin: 0;
      padding: 13px 10px 15px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: center;
      min-height: 26px;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .section-title::after {
      width: 7px;
      height: 7px;
      margin-left: auto;
      border-top: 1.5px solid var(--muted);
      border-right: 1.5px solid var(--muted);
      transform: rotate(-45deg);
      content: "";
    }

    .control,
    .toggle {
      gap: 5px;
      padding: 8px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .control-header,
    .toggle {
      min-height: 25px;
      color: #53646a;
      font-size: 12px;
      font-weight: 700;
    }

    .number-input {
      width: 72px;
      padding: 5px 7px;
      border-color: #dce6e8;
      border-radius: 6px;
      color: var(--accent-dark);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .mode-select {
      min-width: 145px;
      padding: 6px 8px;
      border-color: #dce6e8;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
    }

    input[type="range"] {
      height: 16px;
      accent-color: var(--accent);
    }

    .toggle input { width: 38px; height: 21px; }

    .action-dock {
      position: sticky;
      z-index: 20;
      bottom: -22px;
      margin: 8px -12px -22px;
      padding: 10px 12px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 -12px 24px rgba(24, 45, 52, 0.08);
      backdrop-filter: blur(12px);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      margin: 0;
      padding: 0;
      border-top: 0;
    }

    .toolbar .export-format { min-width: 0; }
    .toolbar .export-format .mode-select { min-width: 0; }
    .toolbar .primary-button { grid-column: 2; }
    .toolbar .secondary-button { grid-column: 1 / -1; }

    .apply-params-button {
      width: 100%;
      min-height: 38px;
      margin: 0 0 8px;
      border: 1px solid #d7e4e5;
      border-radius: 7px;
      color: var(--muted);
      background: #f8fbfb;
      font-size: 13px;
      font-weight: 800;
      transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .apply-params-button.dirty {
      border-color: rgba(15, 151, 141, 0.45);
      color: #fff;
      background: linear-gradient(135deg, #087f78, #066861);
      box-shadow: 0 6px 16px rgba(15, 151, 141, 0.18);
    }

    .apply-params-button:disabled {
      cursor: default;
      opacity: 0.76;
    }

    .primary-button,
    .secondary-button {
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 800;
    }

    .primary-button {
      background: linear-gradient(135deg, #087f78, #066861);
      box-shadow: 0 6px 16px rgba(15, 151, 141, 0.18);
    }

    .secondary-button {
      border: 1px solid #e0e9ea;
      background: #f8fafb;
    }

    .status {
      gap: 5px;
      margin: 14px 10px 0;
      padding: 11px 12px;
      border-radius: 7px;
      background: #f8fbfb;
      font-size: 12px;
    }

    .workspace {
      position: static;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      height: calc(100vh - 72px);
      max-height: none;
      padding: 12px 16px 16px;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .tabs {
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .tab {
      min-width: 68px;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
    }

    .tab.active {
      color: var(--accent-dark);
      background: var(--soft-teal);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .line-editor {
      justify-content: flex-start;
      flex: 1 1 auto;
      min-height: 34px;
      padding: 0;
      overflow-x: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .editor-tool,
    .editor-action {
      min-height: 32px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .editor-tool.active { background: var(--accent); }

    .metric-strip {
      flex-wrap: nowrap;
      gap: 6px;
    }

    .metric {
      padding: 7px 9px;
      border-radius: 6px;
      background: #f8fafb;
      font-size: 12px;
    }

    .metric.danger {
      border-color: rgba(205, 57, 57, 0.35);
      color: #a52828;
      background: #fff1f0;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: default;
    }

    .stage.with-stl {
      grid-template-columns: minmax(285px, var(--preview-width)) 10px minmax(420px, 1fr);
    }

    .preview-pane,
    .stl-pane {
      display: grid;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .preview-pane {
      grid-column: 1;
      position: relative;
      grid-template-rows: minmax(0, 1fr);
      background:
        linear-gradient(135deg, rgba(16, 145, 135, 0.025), transparent 40%),
        #fff;
      cursor: grab;
    }

    .preview-pane::before {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 15px;
      padding: 6px 8px;
      border: 1px solid #e0e8e9;
      border-radius: 5px;
      color: #52646a;
      background: rgba(255, 255, 255, 0.94);
      content: "图稿预览";
      font-size: 12px;
      font-weight: 800;
    }

    .preview-zoom {
      top: 14px;
      right: 14px;
      padding: 4px;
      border-color: #e0e8e9;
      border-radius: 7px;
      box-shadow: 0 6px 18px rgba(24, 45, 52, 0.1);
    }

    .preview-zoom button { width: 28px; height: 28px; }

    .stl-pane {
      grid-column: 3;
      position: relative;
      grid-template-rows: auto minmax(0, 1fr);
      border-color: #dce7e9;
      background:
        linear-gradient(rgba(57, 123, 131, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 123, 131, 0.055) 1px, transparent 1px),
        radial-gradient(circle at 34% 20%, #ffffff, #f2f7f7 72%);
      background-size: 28px 28px, 28px 28px, auto;
      cursor: grab;
    }

    .preview-splitter {
      grid-column: 2;
      grid-row: 1;
      margin: 8px 0;
    }

    .preview-splitter::after {
      top: 0;
      bottom: 0;
    }

    .stl-header {
      position: relative;
      z-index: 3;
      min-height: 46px;
      padding: 8px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.9);
      font-size: 13px;
    }

    .stl-header span::after {
      display: inline-block;
      margin-left: 10px;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--accent-dark);
      background: var(--soft-teal);
      content: "实时预览";
      font-size: 10px;
      font-weight: 800;
    }

    .icon-button {
      border: 1px solid #e0e8e9;
      background: #fff;
    }

    .model-empty-state {
      position: absolute;
      z-index: 2;
      inset: 46px 0 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 9px;
      color: var(--muted);
      pointer-events: none;
    }

    .model-empty-state svg { width: 40px; height: 40px; color: #a8bbbb; }
    .model-empty-state strong { color: #52636a; font-size: 14px; }
    .model-empty-state span { font-size: 12px; }
    .stl-pane:not(.empty) .model-empty-state { display: none; }

    .model-summary {
      display: grid;
      grid-template-columns: 1.45fr 1fr 1fr 1fr;
      min-height: 70px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .summary-item {
      display: grid;
      align-content: center;
      gap: 6px;
      min-width: 0;
      padding: 12px 18px;
      border-right: 1px solid var(--line);
    }

    .summary-item:last-child { border-right: 0; }
    .summary-item span { color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-item strong { overflow: hidden; color: var(--ink); font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }

    .hollow-note,
    .printability-list { font-size: 12px; }
    .printability-badge { font-size: 11px; }
    .legend-item { font-size: 12px; }
    .legend-swatch.selected-island { background: #f29418; }

    body.svg-export-mode #modelThicknessControl,
    body.svg-export-mode .summary-height,
    body.svg-export-mode .summary-faces { display: none; }
    body.svg-export-mode .model-summary { grid-template-columns: 1.45fr 1fr; }

    [hidden] { display: none !important; }

    @media (max-width: 1180px) {
      .app-header { grid-template-columns: 1fr auto; }
      .project-status { display: none; }
      .topbar { grid-template-columns: auto minmax(0, 1fr); }
      .line-editor {
        grid-column: 1 / -1;
        grid-row: 2;
        display: flex;
        padding-top: 6px;
        border-top: 1px solid var(--line);
      }
      .metric-strip { justify-content: flex-end; }
      .stage.with-stl { grid-template-columns: minmax(250px, var(--preview-width)) 10px minmax(360px, 1fr); }
      .workspace { padding: 10px; }
    }

    @media (max-width: 920px) {
      body { overflow: auto; }
      .application-shell { grid-template-rows: auto auto; }
      .app-header { grid-template-columns: 1fr; gap: 10px; padding: 14px 18px; }
      .header-meta { display: none; }
      .app { grid-template-columns: 1fr; height: auto; }
      .sidebar { display: contents; }
      .sidebar > * { grid-column: 1; }
      .sidebar > .drop-zone { order: 1; margin: 12px; }
      .workspace { grid-column: 1; order: 2; }
      .sidebar > .advanced-toggle { order: 3; margin: 10px 12px 0; }
      .sidebar > .section { order: 4; margin: 0 12px; }
      .sidebar > .printability-panel { order: 5; margin: 0 12px; }
      .sidebar > .action-dock { order: 6; }
      .sidebar > .status { order: 7; margin: 14px 12px 24px; }
      .sidebar-splitter, .preview-splitter { display: none; }
      .workspace { height: auto; overflow: visible; }
      .topbar {
        position: sticky;
        z-index: 16;
        top: 0;
        grid-template-columns: 1fr;
      }
      .tabs { grid-column: 1; grid-row: 1; }
      .line-editor {
        grid-column: 1;
        grid-row: 2;
        min-width: 0;
        padding: 7px 0 1px;
      }
      .editor-tool,
      .editor-action { min-height: 40px; flex: 0 0 auto; }
      .metric-strip { display: none; }
      .stage, .stage.with-stl { grid-template-columns: 1fr; height: auto; }
      .preview-pane, .stl-pane { grid-column: 1; }
      .preview-pane, .stl-pane { min-height: 440px; }
      .stl-pane { grid-row: 3; }
      .action-dock { bottom: 0; margin: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
      .toolbar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .export-format { padding: 8px 10px; }
      .model-summary { grid-template-columns: 1fr; }
      body.svg-export-mode .model-summary { grid-template-columns: 1fr 1fr; }
      .summary-item { min-height: 58px; }
    }

  

  </style>
</head>
<body>

  <div class="application-shell">
    <header class="app-header">
      <div class="header-brand">
        <div>
          <strong>镂空生成器</strong>
          <span>白色生成实体，黑色生成贯穿镂空</span>
        </div>
      </div>
      <div class="project-status">
        <span>黑色区域自动镂空</span>
        <span class="save-state" data-tone="neutral">等待图片</span>
      </div>
      <div class="header-meta" aria-label="工作区状态">
<span class="header-chip">本地处理</span>
        <span class="header-chip">STL / 3MF / SVG</span>
      </div>
    </header>
    <main class="app">
    <aside class="sidebar">
      <label class="drop-zone" id="dropZone">
        <input class="file-input" id="fileInput" type="file" accept="image/*">
        <span class="upload-button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 16V4m0 0L7 9m5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          上传黑白图
        </span>
        <span class="file-name" id="fileName">尚未上传图片</span>
      </label>

      <button class="advanced-toggle" id="advancedToggleButton" type="button" aria-expanded="false">
        高级设置
        <span aria-hidden="true">⌄</span>
      </button>

      <section class="section advanced-only" aria-label="识别参数">
        <div class="section-title">识别</div>
        <label class="toggle">
          <span>快速预览（导出自动精细处理）</span>
          <input id="fastPreview" type="checkbox" checked>
        </label>
        <label class="control advanced-only">
          <span class="control-header">
            <span>黑色阈值</span>
            <input class="number-input" id="thresholdValue" type="number" min="30" max="230" value="145" step="1" aria-label="黑色阈值">
          </span>
          <input id="threshold" type="range" min="30" max="230" value="145" step="1" aria-label="黑色阈值滑条">
        </label>
        <label class="control">
          <span class="control-header">
            <span>细节采样</span>
            <input class="number-input" id="resolutionValue" type="number" min="900" max="16000" value="1600" step="50" aria-label="细节采样">
          </span>
          <input id="resolution" type="range" min="900" max="16000" value="1600" step="50" aria-label="细节采样滑条">
          <span class="sampling-warning" id="samplingWarning" hidden></span>
        </label>
        <label class="control">
          <span class="control-header">
            <span>杂点清理</span>
            <input class="number-input" id="cleanupValue" type="number" min="0" max="12" value="3" step="1" aria-label="杂点清理">
          </span>
          <input id="cleanup" type="range" min="0" max="12" value="3" step="1" aria-label="杂点清理滑条">
        </label>
        <label class="control">
          <span class="control-header">
            <span>镂空闭合</span>
            <input class="number-input" id="closeValue" type="number" min="0" max="14" value="0" step="1" aria-label="镂空闭合强度">
          </span>
          <input id="closeStrength" type="range" min="0" max="14" value="0" step="1" aria-label="镂空闭合强度滑条">
        </label>
        <label class="control">
          <span class="control-header">
            <span>最小镂空面积</span>
            <input class="number-input" id="minHoleAreaValue" type="number" min="0" max="20" value="0.5" step="0.1" aria-label="最小镂空面积">
          </span>
          <input id="minHoleArea" type="range" min="0" max="20" value="0.5" step="0.1" aria-label="最小镂空面积滑条">
        </label>
      </section>

      <section class="section" aria-label="模型参数">
        <div class="section-title">模型</div>
        <label class="control">
          <span class="control-header">
            <span>整体尺寸</span>
            <input class="number-input" id="sizeValue" type="number" min="40" max="220" value="120" step="0.5" aria-label="整体尺寸">
          </span>
          <input id="modelSize" type="range" min="40" max="220" value="120" step="0.5" aria-label="整体尺寸滑条">
        </label>
        <label class="control">
          <span class="control-header">
            <span>镂空扩张</span>
            <input class="number-input" id="wireWidthValue" type="number" min="-2" max="4.0" value="0.2" step="0.01" aria-label="镂空扩张">
          </span>
          <input id="wireWidth" type="range" min="-2" max="4.0" value="0.2" step="0.01" aria-label="镂空扩张滑条">
        </label>
        <label class="control" id="modelThicknessControl">
          <span class="control-header">
            <span>模型厚度</span>
            <input class="number-input" id="wireHeightValue" type="number" min="0.4" max="6.0" value="2.0" step="0.1" aria-label="模型厚度">
          </span>
          <input id="wireHeight" type="range" min="0.4" max="6.0" value="2.0" step="0.1" aria-label="模型厚度滑条">
        </label>
        <label class="control advanced-only">
          <span class="control-header">
            <span>轮廓平滑</span>
            <input class="number-input" id="contourSmoothValue" type="number" min="0" max="8" value="3" step="1" aria-label="轮廓平滑">
          </span>
          <input id="contourSmooth" type="range" min="0" max="8" value="3" step="1" aria-label="轮廓平滑滑条">
        </label>
        <input id="baseEnabled" type="checkbox" checked hidden>
        <div class="hollow-note">
          <strong>颜色规则</strong>
          <span>白色保留为实体，黑色扣除为贯穿镂空；孤岛标红，当前选择标橙。</span>
          <div class="color-legend" aria-label="预览颜色说明">
            <span class="legend-item"><span class="legend-swatch solid"></span>实体</span>
            <span class="legend-item"><span class="legend-swatch cutout"></span>镂空</span>
            <span class="legend-item"><span class="legend-swatch island"></span>孤岛</span>
            <span class="legend-item"><span class="legend-swatch selected-island"></span>当前孤岛</span>
          </div>
        </div>
        <label class="control" id="baseShapeControl">
          <span class="control-header">
            <span>实体外框</span>
            <select class="mode-select" id="baseShape" aria-label="实体外框">
              <option value="rectangle" selected>自动（图案范围）</option>
              <option value="circle">圆形外框</option>
              <option value="square">方形外框</option>
              <option value="alpha">透明轮廓</option>
            </select>
          </span>
        </label>
        <label class="control" id="baseControl">
          <span class="control-header">
            <span>底层外扩</span>
            <input class="number-input" id="baseMarginValue" type="number" min="0" value="0.4" step="0.1" aria-label="底层外扩">
          </span>
          <input id="baseMargin" type="range" min="0" max="100" value="0.4" step="0.1" aria-label="底层外扩滑条">
        </label>
        <label class="control" id="baseRimControl" hidden>
          <span class="control-header">
            <span>边缘加强宽度</span>
            <input class="number-input" id="baseRimWidthValue" type="number" min="0" max="20" value="0" step="0.1" aria-label="边缘加强宽度">
          </span>
          <input id="baseRimWidth" type="range" min="0" max="20" value="0" step="0.1" aria-label="边缘加强宽度滑条">
        </label>
        <label class="control" id="baseThicknessControl" hidden>
          <span class="control-header">
            <span>镂空底层厚度</span>
            <input class="number-input" id="baseThicknessValue" type="number" min="0.2" max="4.0" value="0.4" step="0.1" aria-label="镂空底层厚度">
          </span>
          <input id="baseThickness" type="range" min="0.2" max="4.0" value="0.4" step="0.1" aria-label="镂空底层厚度滑条">
        </label>
      </section>

      <section class="printability-panel" aria-label="可打印性检查">
        <div class="printability-header">
          <strong>可打印性</strong>
          <span class="printability-badge" id="printabilityBadge">等待图片</span>
        </div>
        <ul class="printability-list" id="printabilityList">
          <li>上传图片后检查孤岛、窄连接、孔径和边缘距离</li>
        </ul>
        <div class="island-actions" id="islandActions" hidden>

  <script>
    const $ = (id) => document.getElementById(id);

    const controls = {
      fileInput: $("fileInput"),
      dropZone: $("dropZone"),
      fileName: $("fileName"),
      advancedToggleButton: $("advancedToggleButton"),
      fastPreview: $("fastPreview"),
      threshold: $("threshold"),
      resolution: $("resolution"),
      samplingWarning: $("samplingWarning"),
      cleanup: $("cleanup"),
      closeStrength: $("closeStrength"),
      minHoleArea: $("minHoleArea"),
      modelSize: $("modelSize"),
      wireWidth: $("wireWidth"),
      wireHeight: $("wireHeight"),
      contourSmooth: $("contourSmooth"),
      baseEnabled: $("baseEnabled"),
      baseShape: $("baseShape"),
      baseShapeControl: $("baseShapeControl"),
      baseMargin: $("baseMargin"),
      baseRimWidth: $("baseRimWidth"),
      baseThickness: $("baseThickness"),
      baseControl: $("baseControl"),
      baseRimControl: $("baseRimControl"),
      baseThicknessControl: $("baseThicknessControl"),
      applyParamsButton: $("applyParamsButton"),
      lineEditor: $("lineEditor"),
      brushToolButton: $("brushToolButton"),
      splineToolButton: $("splineToolButton"),
      editSplineToolButton: $("editSplineToolButton"),
      eraserToolButton: $("eraserToolButton"),
      baseCutToolButton: $("baseCutToolButton"),
      bridgeToolButton: $("bridgeToolButton"),
      editorSize: $("editorSize"),
      editorSizeValue: $("editorSizeValue"),
      editorSizeLabel: $("editorSizeLabel"),
      editorSizeControl: $("editorSizeControl"),
      undoEditButton: $("undoEditButton"),
      redoEditButton: $("redoEditButton"),
      clearEditButton: $("clearEditButton"),
      printabilityBadge: $("printabilityBadge"),
      printabilityList: $("printabilityList"),
      islandActions: $("islandActions"),
      islandCounter: $("islandCounter"),
      previousIslandButton: $("previousIslandButton"),
      nextIslandButton: $("nextIslandButton"),
      autoBridgeButton: $("autoBridgeButton"),
      deleteIslandButton: $("deleteIslandButton"),
      bridgeConfirmActions: $("bridgeConfirmActions"),
      cancelAutoBridgeButton: $("cancelAutoBridgeButton"),
      confirmAutoBridgeButton: $("confirmAutoBridgeButton"),
      exportFormat: $("exportFormat"),
      generateButton: $("generateButton"),
      generate3mfButton: $("generate3mfButton"),
      downloadStlButton: $("downloadStlButton"),
      download3mfButton: $("download3mfButton"),
      downloadSvgButton: $("downloadSvgButton"),
      previewPane: $("previewPane"),
      zoomInButton: $("zoomInButton"),
      zoomOutButton: $("zoomOutButton"),
      resetPreviewView: $("resetPreviewView"),
      stlPane: $("stlPane"),
      stlCanvas: $("stlCanvas"),
      resetStlView: $("resetStlView"),
      modelEmptyState: $("modelEmptyState"),
      previewCanvas: $("previewCanvas"),
      stage: $("stage"),
      sidebarSplitter: $("sidebarSplitter"),
      previewSplitter: $("previewSplitter"),
      toast: $("toast"),
      statusText: $("statusText"),
      statsText: $("statsText"),
      pixelMetric: $("pixelMetric"),
      lineMetric: $("lineMetric"),
      modelMetric: $("modelMetric"),
      summarySize: $("summarySize"),
      summaryHeight: $("summaryHeight"),
      summaryFaces: $("summaryFaces"),
      summaryFormat: $("summaryFormat")
    };

    const labels = {
      thresholdValue: $("thresholdValue"),
      resolutionValue: $("resolutionValue"),
      cleanupValue: $("cleanupValue"),
      closeValue: $("closeValue"),
      minHoleAreaValue: $("minHoleAreaValue"),
      sizeValue: $("sizeValue"),
      wireWidthValue: $("wireWidthValue"),
      wireHeightValue: $("wireHeightValue"),
      contourSmoothValue: $("contourSmoothValue"),
      baseMarginValue: $("baseMarginValue"),
      baseRimWidthValue: $("baseRimWidthValue"),
      baseThicknessValue: $("baseThicknessValue")
    };

    function installParameterTips(tips) {
      Object.entries(tips).forEach(([id, tip]) => {
        const input = $(id);
        const control = input && typeof input.closest === "function" ? input.closest(".control, .toggle, .sketch-field") : null;
        if (control) control.dataset.tip = tip;
      });
    }

    installParameterTips({
      threshold: "亮度低于此值的像素会被识别为黑色镂空。提高数值可识别更浅的区域。",
      fastPreview: "编辑时将最长边限制在 1600 像素；导出前会自动按细节采样设置重新处理。",
      resolution: "图片预处理的最长边像素。数值越高，细节越完整，但生成会更慢。",
      cleanup: "删除小面积孤立杂点。数值过高会一并删掉细小图案。",
      closeStrength: "自动连接临近的黑色区域。数值过高可能让原本分开的镂空粘连。",
      minHoleArea: "小于该面积的黑色区域不会镂空，单位为平方毫米。输入 0 可保留全部镂空。",
      modelSize: "整体等比例缩放外框和内部镂空；数值是最终实体外框最长边，单位为 mm。",
      wireWidth: "对识别出的黑色镂空向外扩张或向内收缩，单位为 mm。负值会缩小镂空。",
      wireHeight: "最终镂空模型的整体厚度，单位为 mm。",
      contourSmooth: "平滑外轮廓的锯齿和噪点。数值越大越圆滑，也越容易损失尖细细节。",
      baseEnabled: "镂空生成器始终生成白色实体底面。",
      baseShape: "自动模式按图案范围生成矩形外框；圆形和方形生成规则外框；透明轮廓读取 PNG/WebP 的 Alpha 边界。",
      baseMargin: "实体外框从黑色图案外缘向外延伸的距离，单位为 mm。可直接输入大于滑条上限的数值。",
      baseRimWidth: "沿底层外边和孔洞边缘生成加强结构，高度与骨架相同。输入 0 可关闭。",
      baseThickness: "镂空底层的厚度，单位为 mm。"
    });

    const state = {
      source: null,
      processed: null,
      previewMode: "line",
      selectedIslandIndex: 0,
      autoBridgeProposal: null,
      lineEdits: [],
      baseCuts: [],
      editHistory: [],
      redoHistory: [],
      editor: { tool: "brush", brushSize: 0.8, eraserSize: 1.2, bridgeSize: 1.2, draft: null, hover: null, selectedSplineIndex: null, pointDrag: null },
      view: { x: 0, y: 0, zoom: 1 },
      stlBlob: null,
      stlBytes: 0,
      stlTriangleCount: 0,
      stlName: "hollow-model.stl",
      threeMfBlob: null,
      threeMfBytes: 0,
      threeMfTriangleCount: 0,
      threeMfName: "hollow-model.3mf",
      svgBlob: null,
      svgName: "hollow-model.svg",
      stlMesh: null,
      stlGl: null,
      stlView: { rotX: -0.76, rotY: 0.38, zoom: 1, panX: 0, panY: 0 },
      stlRenderQueued: false,
      worker: null,
      workerUrl: "",
      workerRequests: new Map(),
      workerRequestId: 0,
      workerBusy: false,
      workerMaskRevision: -1,
      maskRevision: 0,
      processingId: 0,
      processing: false,
      generationId: 0,
      paramsDirty: false
    };

    const HIGH_SAMPLE_WARNING = 4000;
    const DRAFT_PREVIEW_RESOLUTION = 1600;
    const MIN_PRINTABLE_WALL_MM = 1.2;
    const MIN_PRINTABLE_HOLE_MM = 0.8;
    const MIN_MODEL_THICKNESS_MM = 0.8;
    const MAX_MESH_PIXELS_PER_MM = 12;
    const MAX_MESH_LONGEST_SIDE = 2800;
    const MAX_MESH_PIXELS = 6000000;
    const MAX_PREVIEW_TRIANGLES = 500000;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const debounce = (fn, wait = 160) => {
      let timer = 0;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    };

    function updateSamplingWarning() {
      const resolution = Number(controls.resolution.value) || 0;
      if (resolution < HIGH_SAMPLE_WARNING) {
        controls.samplingWarning.hidden = true;
        controls.samplingWarning.textContent = "";
        return;
      }
      const aspect = state.source
        ? Math.min(state.source.width, state.source.height) / Math.max(state.source.width, state.source.height)
        : 1;
      const pixels = resolution * resolution * aspect;
      const memoryMb = Math.round(pixels * 26 / 1024 / 1024);
      controls.samplingWarning.textContent = `高采样预计处理 ${(pixels / 1000000).toFixed(1)} 百万像素，峰值内存约 ${memoryMb} MB；STL 网格会自动限流。`;
      controls.samplingWarning.hidden = false;
    }

    function updateLabels() {
      labels.thresholdValue.value = controls.threshold.value;
      labels.resolutionValue.value = controls.resolution.value;
      labels.cleanupValue.value = controls.cleanup.value;
      labels.closeValue.value = controls.closeStrength.value;
      labels.minHoleAreaValue.value = Number(controls.minHoleArea.value).toFixed(1);
      labels.sizeValue.value = controls.modelSize.value;
      labels.wireWidthValue.value = Number(controls.wireWidth.value).toFixed(2);
      labels.wireHeightValue.value = Number(controls.wireHeight.value).toFixed(1);
      labels.contourSmoothValue.value = controls.contourSmooth.value;
      labels.baseMarginValue.value = Number(controls.baseMargin.value).toFixed(1);
      labels.baseRimWidthValue.value = Number(controls.baseRimWidth.value).toFixed(1);
      labels.baseThicknessValue.value = Number(controls.baseThickness.value).toFixed(1);
      controls.baseShapeControl.style.display = "grid";
      controls.baseControl.style.display = "grid";
      updateSamplingWarning();
    }

    function activeEditorSize() {
      if (state.editor.tool === "eraser") return state.editor.eraserSize;
      if (state.editor.tool === "bridge") return state.editor.bridgeSize;
      return state.editor.brushSize;
    }

    function updateEditorControls() {
      const lineMode = state.previewMode === "line";
      controls.lineEditor.hidden = !lineMode;
      controls.stage.classList.toggle("editing", lineMode);
      const toolButtons = [
        [controls.brushToolButton, "brush"],
        [controls.splineToolButton, "spline"],
        [controls.editSplineToolButton, "editSpline"],
        [controls.eraserToolButton, "eraser"],
        [controls.baseCutToolButton, "baseCut"],
        [controls.bridgeToolButton, "bridge"]
      ];
      toolButtons.forEach(([button, tool]) => {
        const active = state.editor.tool === tool;
        button.classList.toggle("active", active);
        button.setAttribute?.("aria-pressed", String(active));
      });
      const adjustSize = state.editor.tool !== "editSpline" && state.editor.tool !== "baseCut";
      controls.editorSizeControl.hidden = !adjustSize;
      if (adjustSize) {
        const size = activeEditorSize();
        const label = state.editor.tool === "eraser"
          ? "补实体 mm"
          : state.editor.tool === "spline"
            ? "镂空样条 mm"
            : state.editor.tool === "bridge"
              ? "桥宽 mm"
              : "镂空笔 mm";
        const minimum = state.editor.tool === "bridge" ? 1.2 : 0.2;
        controls.editorSize.min = String(minimum);
        controls.editorSizeValue.min = String(minimum);
        controls.editorSize.value = Number(size).toFixed(1);
        controls.editorSizeValue.value = Number(size).toFixed(1);
        controls.editorSizeLabel.textContent = label;
        controls.editorSize.setAttribute?.("aria-label", `${label}滑条`);
        controls.editorSizeValue.setAttribute?.("aria-label", label);
      }
      controls.undoEditButton.disabled = state.editHistory.length === 0;
      controls.redoEditButton.disabled = state.redoHistory.length === 0;
      controls.clearEditButton.disabled = state.lineEdits.length === 0 && state.baseCuts.length === 0;
    }

    function setEditorTool(tool) {
      if (state.editor.tool === tool) return;
      cancelAutoBridgeProposal(false);
      state.editor.tool = tool;
      state.editor.draft = null;
      state.editor.hover = null;
      state.editor.pointDrag = null;
      if (tool !== "editSpline") state.editor.selectedSplineIndex = null;
      updateEditorControls();
      renderPreview();
    }

    function setEditorSize(value) {
      const minimum = state.editor.tool === "bridge" ? 1.2 : 0.2;
      const size = clamp(Number(value) || 0.8, minimum, 12);
      if (state.editor.tool === "eraser") state.editor.eraserSize = size;
      else if (state.editor.tool === "bridge") state.editor.bridgeSize = size;
      else state.editor.brushSize = size;
      updateEditorControls();
      renderPreview();
    }

    function showToast(message) {
      controls.toast.textContent = message;
      controls.toast.classList.add("visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => controls.toast.classList.remove("visible"), 2600);
    }

    function stopWorker() {
      if (state.worker) {
        state.worker.terminate();
        state.worker = null;
      }
      if (state.workerUrl) {
        URL.revokeObjectURL(state.workerUrl);
        state.workerUrl = "";
      }
      const error = new Error("任务已取消");
      for (const request of state.workerRequests.values()) request.reject(error);
      state.workerRequests.clear();
      state.workerBusy = false;
      state.workerMaskRevision = -1;
    }

    function setStlPanelVisible(visible) {
      const shouldShow = Boolean(visible && controls.exportFormat.value !== "svg");
      controls.stlPane.hidden = !shouldShow;
      controls.previewSplitter.hidden = !shouldShow;
      controls.stlPane.classList.toggle("empty", !shouldShow);
      controls.modelEmptyState.hidden = true;
      controls.stage.classList.toggle("with-stl", shouldShow);
      requestAnimationFrame(() => {
        renderPreview();
        if (shouldShow) requestStlRender();
      });
    }

    const PANEL_SIZE_STORAGE = {
      sidebar: "hollow-generator-sidebar-width",
      preview: "hollow-generator-preview-width"
    };
    let panelResizeFrame = 0;

    function readStoredPanelSize(key) {
      try {
        const value = Number(window.localStorage.getItem(key));
        return Number.isFinite(value) && value > 0 ? value : null;
      } catch (_) {
        return null;
      }
    }

    function savePanelSize(key, value) {
      try {
        window.localStorage.setItem(key, String(Math.round(value)));
      } catch (_) {
        // The layout still works when local storage is unavailable.
      }
    }

    function schedulePanelResizeRender() {
      if (panelResizeFrame) return;
      panelResizeFrame = requestAnimationFrame(() => {
        panelResizeFrame = 0;
        renderPreview();
        requestStlRender();
      });
    }

    function setPanelWidth(kind, requestedWidth, persist = true) {
      if (window.matchMedia("(max-width: 920px)").matches) return;
      const root = document.documentElement;
      let width = Number(requestedWidth);
      if (!Number.isFinite(width)) return;
      if (kind === "sidebar") {
        const appRect = document.querySelector(".app").getBoundingClientRect();
        width = clamp(width, 270, Math.max(270, appRect.width - 520));
        root.style.setProperty("--sidebar-width", `${Math.round(width)}px`);
      } else {
        const stageRect = controls.stage.getBoundingClientRect();
        width = clamp(width, 285, Math.max(285, stageRect.width - 430));
        root.style.setProperty("--preview-width", `${Math.round(width)}px`);
      }
      if (persist) savePanelSize(PANEL_SIZE_STORAGE[kind], width);
      schedulePanelResizeRender();
    }

    function restorePanelWidths() {
      const sidebarWidth = readStoredPanelSize(PANEL_SIZE_STORAGE.sidebar);
      const previewWidth = readStoredPanelSize(PANEL_SIZE_STORAGE.preview);
      if (sidebarWidth) setPanelWidth("sidebar", sidebarWidth, false);
      if (previewWidth) setPanelWidth("preview", previewWidth, false);
    }

    function installPanelSplitter(splitter, kind) {
      if (!splitter) return;
      splitter.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        const rect = kind === "sidebar"
          ? document.querySelector(".app").getBoundingClientRect()
          : controls.stage.getBoundingClientRect();
        const startWidth = kind === "sidebar"
          ? document.querySelector(".sidebar").getBoundingClientRect().width
          : controls.previewPane.getBoundingClientRect().width;
        const startX = event.clientX;
        splitter.classList.add("dragging");
        document.body.classList.add("resizing-panels");
        splitter.setPointerCapture?.(event.pointerId);

        const move = (moveEvent) => {
          const nextWidth = startWidth + moveEvent.clientX - startX;
          setPanelWidth(kind, nextWidth, false);
        };
        const finish = (finishEvent) => {
          const finalWidth = startWidth + finishEvent.clientX - startX;
          setPanelWidth(kind, finalWidth, true);
          splitter.classList.remove("dragging");
          document.body.classList.remove("resizing-panels");
          splitter.releasePointerCapture?.(event.pointerId);
          splitter.removeEventListener("pointermove", move);
          splitter.removeEventListener("pointerup", finish);
          splitter.removeEventListener("pointercancel", cancel);
        };
        const cancel = () => {
          splitter.classList.remove("dragging");
          document.body.classList.remove("resizing-panels");
          splitter.removeEventListener("pointermove", move);
          splitter.removeEventListener("pointerup", finish);
          splitter.removeEventListener("pointercancel", cancel);
        };
        splitter.addEventListener("pointermove", move);
        splitter.addEventListener("pointerup", finish);
        splitter.addEventListener("pointercancel", cancel);
      });
      splitter.addEventListener("keydown", (event) => {
        const direction = event.key === "ArrowLeft" ? -1 : event.key === "ArrowRight" ? 1 : 0;
        if (!direction) return;
        event.preventDefault();
        const target = kind === "sidebar" ? document.querySelector(".sidebar") : controls.previewPane;
        setPanelWidth(kind, target.getBoundingClientRect().width + direction * (event.shiftKey ? 40 : 12));
      });
    }

    function setUpResizablePanels() {
      installPanelSplitter(controls.sidebarSplitter, "sidebar");
      installPanelSplitter(controls.previewSplitter, "preview");
      requestAnimationFrame(restorePanelWidths);
    }

    function resetStlView() {
      state.stlView.rotX = -0.76;
      state.stlView.rotY = 0.38;
      state.stlView.zoom = 1;
      state.stlView.panX = 0;
      state.stlView.panY = 0;
      requestStlRender();
    }

    function selectedExportAsset() {
      const format = controls.exportFormat.value;
      if (format === "3mf") return { blob: state.threeMfBlob, name: state.threeMfName, types: saveFileTypes?.threeMf };
      if (format === "svg") return { blob: state.svgBlob, name: state.svgName, types: saveFileTypes?.svg };
      return { blob: state.stlBlob, name: state.stlName, types: saveFileTypes?.stl };
    }

    function updateWorkspaceState() {
      const saveState = document.querySelector(".save-state");
      if (!saveState) return;
      let text = "等待图片";
      let tone = "neutral";
      if (state.processing) {
        text = "正在识别";
      } else if (state.paramsDirty) {
        text = "参数待确认";
        tone = "warning";
      } else if (state.processed?.solidIslandCount > 0) {
        text = `${state.processed.solidIslandCount} 个孤岛待处理`;
        tone = "danger";
      } else if (state.processed) {
        text = "预览已就绪";
        tone = "ready";
      } else if (state.source) {
        text = "准备识别";
      }
      saveState.textContent = text;
      saveState.dataset.tone = tone;
    }

    function updateExportUi() {
      const format = controls.exportFormat.value;
      const asset = selectedExportAsset();
      const busy = state.processing || state.workerBusy;
      const formatLabel = format.toUpperCase();
      document.body.classList.toggle("svg-export-mode", format === "svg");
      controls.summaryFormat.textContent = formatLabel;
      controls.summaryFaces.textContent = format === "svg"
        ? state.svgBlob ? "矢量轮廓" : "等待生成"
        : format === "3mf"
          ? state.threeMfBlob ? state.threeMfTriangleCount.toLocaleString() : "等待生成"
          : state.stlBlob ? state.stlTriangleCount.toLocaleString() : "等待生成";
      controls.generateButton.disabled = busy || state.paramsDirty || !state.processed;
      controls.downloadStlButton.disabled = busy || state.paramsDirty || !asset.blob;
      if (!busy) controls.generateButton.textContent = `生成 ${formatLabel}`;
      controls.downloadStlButton.textContent = `下载 ${formatLabel}`;
      setStlPanelVisible(Boolean(state.stlMesh));
      updateWorkspaceState();
    }

    function invalidateModel() {
      if (state.workerBusy) stopWorker();
      state.processingId += 1;
      state.processing = false;
      state.generationId += 1;
      state.stlBlob = null;
      state.stlBytes = 0;
      state.stlTriangleCount = 0;
      state.threeMfBlob = null;
      state.threeMfBytes = 0;
      state.threeMfTriangleCount = 0;
      state.svgBlob = null;
      state.autoBridgeProposal = null;
      state.stlMesh = null;
      setStlPanelVisible(false);
      controls.downloadStlButton.disabled = true;
      controls.download3mfButton.disabled = true;
      controls.downloadSvgButton.disabled = true;
      controls.statsText.textContent = "参数已更新，等待生成文件";
      controls.summaryFaces.textContent = "等待生成";
      updateIslandControls(state.processed);
      updateExportUi();
      renderPreview();
    }

    function updateParameterCommitUi() {
      const dirty = !!state.paramsDirty;
      controls.applyParamsButton.classList.toggle("dirty", dirty);
      controls.applyParamsButton.hidden = !state.processing && !dirty;
      controls.applyParamsButton.disabled = state.processing || !dirty || !state.source;
      controls.applyParamsButton.textContent = state.processing ? "正在处理" : dirty ? "确认参数并更新预览" : "参数已确认";
      controls.applyParamsButton.title = dirty
        ? "点击后统一应用当前参数，并重新识别线稿与刷新预览"
        : "修改任意参数后，在这里统一确认";
      controls.generateButton.disabled = state.processing || dirty || !state.processed;
      controls.generate3mfButton.disabled = state.processing || dirty || !state.processed;
      controls.downloadSvgButton.disabled = state.processing || dirty || !state.processed;
      updateExportUi();
      updateWorkspaceState();
    }

    function markParametersPending() {
      updateLabels();
      if (!state.paramsDirty) {
        invalidateModel();
      }
      state.paramsDirty = true;
      updateParameterCommitUi();
      controls.statusText.textContent = "参数已修改，等待确认";
      controls.statsText.textContent = "点击“确认参数并更新预览”后才会重新计算";
    }

    function applyPendingParameters() {
      if (!state.source) return;
      state.paramsDirty = false;
      updateParameterCommitUi();
      processSource();
    }

    function ensureParametersCommitted() {
      if (!state.paramsDirty) return true;
      showToast("请先点击“确认参数并更新预览”");
      controls.statusText.textContent = "请先确认参数";
      controls.applyParamsButton.focus();
      return false;
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        showToast("请选择图片文件");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          state.lineEdits = [];
          state.baseCuts = [];
          state.editHistory = [];
          state.redoHistory = [];
          state.selectedIslandIndex = 0;
          state.autoBridgeProposal = null;
          state.editor.draft = null;
          state.editor.hover = null;
          state.editor.selectedSplineIndex = null;
          state.editor.pointDrag = null;
          state.source = {
            image,
            width: image.naturalWidth || image.width,
            height: image.naturalHeight || image.height,
            name: file.name
          };
          controls.fileName.textContent = file.name;
          controls.statusText.textContent = "图片已载入，准备处理";
          processSource();
          showToast("图片已载入，正在后台处理");
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function detectCropBox(source) {
      const maxProbe = 560;
      const scale = Math.min(1, maxProbe / Math.max(source.width, source.height));
      const probeWidth = Math.max(16, Math.round(source.width * scale));
      const probeHeight = Math.max(16, Math.round(source.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = probeWidth;
      canvas.height = probeHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, probeWidth, probeHeight);
      ctx.drawImage(source.image, 0, 0, probeWidth, probeHeight);
      const data = ctx.getImageData(0, 0, probeWidth, probeHeight).data;
      const corner = Math.max(3, Math.floor(Math.min(probeWidth, probeHeight) * 0.035));
      let bgR = 0, bgG = 0, bgB = 0, samples = 0;
      const addCorner = (x0, y0) => {
        for (let y = y0; y < y0 + corner; y += 1) {
          for (let x = x0; x < x0 + corner; x += 1) {
            const i = (y * probeWidth + x) * 4;
            bgR += data[i];
            bgG += data[i + 1];
            bgB += data[i + 2];
            samples += 1;
          }
        }
      };
      addCorner(0, 0);
      addCorner(probeWidth - corner, 0);
      addCorner(0, probeHeight - corner);
      addCorner(probeWidth - corner, probeHeight - corner);
      bgR /= samples;
      bgG /= samples;
      bgB /= samples;

      let minX = probeWidth, minY = probeHeight, maxX = -1, maxY = -1;
      for (let y = 0; y < probeHeight; y += 1) {
        for (let x = 0; x < probeWidth; x += 1) {
          const i = (y * probeWidth + x) * 4;
          const dist = Math.hypot(data[i] - bgR, data[i + 1] - bgG, data[i + 2] - bgB);
          if (dist > 20) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }
      if (maxX < minX || maxY < minY) {
        return { x: 0, y: 0, width: source.width, height: source.height };
      }
      const pad = Math.max(3, Math.round(Math.max(probeWidth, probeHeight) * 0.015));
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(probeWidth - 1, maxX + pad);
      maxY = Math.min(probeHeight - 1, maxY + pad);
      const x = Math.floor(minX * source.width / probeWidth);
      const y = Math.floor(minY * source.height / probeHeight);
      const width = Math.min(source.width - x, Math.ceil((maxX - minX + 1) * source.width / probeWidth));
      const height = Math.min(source.height - y, Math.ceil((maxY - minY + 1) * source.height / probeHeight));
      return { x, y, width, height };
    }

    function getImageData(source, width, height, crop) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(source.image, crop.x, crop.y, crop.width, crop.height, 0, 0, width, height);
      return ctx.getImageData(0, 0, width, height);
    }

    function makeAlphaMask(imageData, width, height) {
      const data = imageData.data;
      const mask = new Uint8Array(width * height);
      let transparentPixels = 0;
      for (let offset = 3, pixel = 0; offset < data.length; offset += 4, pixel += 1) {
        const alpha = data[offset];
        mask[pixel] = alpha >= 16 ? 1 : 0;
        if (alpha < 250) transparentPixels += 1;
      }
      return { mask, hasTransparency: transparentPixels > Math.max(4, mask.length * 0.001) };
    }

    function makeInkMask(imageData, width, height, threshold) {
      const data = imageData.data;
      const mask = new Uint8Array(width * height);
      for (let i = 0, p = 0; i < data.length; i += 4, p += 1) {
        const alpha = data[i + 3] / 255;
        const r = data[i] * alpha + 255 * (1 - alpha);
        const g = data[i + 1] * alpha + 255 * (1 - alpha);
        const b = data[i + 2] * alpha + 255 * (1 - alpha);
        const gray = r * 0.299 + g * 0.587 + b * 0.114;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const sat = max === 0 ? 0 : (max - min) / max;
        mask[p] = (gray < threshold && sat < 0.55) || gray < threshold * 0.56 ? 1 : 0;
      }
      return mask;
    }

    function dilate(mask, width, height, radius) {
      if (radius <= 0) return mask;
      const temp = new Uint8Array(mask.length);
      const dst = new Uint8Array(mask.length);
      for (let y = 0; y < height; y += 1) {
        let count = 0;
        for (let x = -radius; x <= radius; x += 1) {
          if (x >= 0 && x < width) count += mask[y * width + x];
        }
        for (let x = 0; x < width; x += 1) {
          temp[y * width + x] = count > 0 ? 1 : 0;
          const remove = x - radius;
          const add = x + radius + 1;
          if (remove >= 0) count -= mask[y * width + remove];
          if (add < width) count += mask[y * width + add];
        }
      }
      for (let x = 0; x < width; x += 1) {
        let count = 0;
        for (let y = -radius; y <= radius; y += 1) {
          if (y >= 0 && y < height) count += temp[y * width + x];
        }
        for (let y = 0; y < height; y += 1) {
          dst[y * width + x] = count > 0 ? 1 : 0;
          const remove = y - radius;
          const add = y + radius + 1;
          if (remove >= 0) count -= temp[remove * width + x];
          if (add < height) count += temp[add * width + x];
        }
      }
      return dst;
    }

    function erode(mask, width, height, radius) {
      if (radius <= 0) return mask;
      const temp = new Uint8Array(mask.length);
      const dst = new Uint8Array(mask.length);
      const span = radius * 2 + 1;
      for (let y = 0; y < height; y += 1) {
        let count = 0;
        for (let x = -radius; x <= radius; x += 1) {
          if (x >= 0 && x < width) count += mask[y * width + x];
        }
        for (let x = 0; x < width; x += 1) {
          temp[y * width + x] = count === span ? 1 : 0;
          const remove = x - radius;
          const add = x + radius + 1;
          if (remove >= 0) count -= mask[y * width + remove];
          if (add < width) count += mask[y * width + add];
        }
      }
      for (let x = 0; x < width; x += 1) {
        let count = 0;
        for (let y = -radius; y <= radius; y += 1) {
          if (y >= 0 && y < height) count += temp[y * width + x];
        }
        for (let y = 0; y < height; y += 1) {
          dst[y * width + x] = count === span ? 1 : 0;
          const remove = y - radius;
          const add = y + radius + 1;
          if (remove >= 0) count -= temp[remove * width + x];
          if (add < height) count += temp[add * width + x];
        }
      }
      return dst;
    }

    function closeMask(mask, width, height, radius) {
      return erode(dilate(mask, width, height, radius), width, height, radius);
    }

    function smoothMask(mask, width, height, iterations) {
      let src = mask;
      let dst = new Uint8Array(mask.length);
      for (let iter = 0; iter < iterations; iter += 1) {
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            let count = 0;
            for (let oy = -1; oy <= 1; oy += 1) {
              const yy = y + oy;
              if (yy < 0 || yy >= height) continue;
              for (let ox = -1; ox <= 1; ox += 1) {
                const xx = x + ox;
                if (xx < 0 || xx >= width) continue;
                count += src[yy * width + xx];
              }
            }
            const i = y * width + x;
            dst[i] = src[i] ? (count >= 4 ? 1 : 0) : (count >= 6 ? 1 : 0);
          }
        }
        const temp = src;
        src = dst;
        dst = temp;
      }
      return src;
    }

    function removeSmallComponents(mask, width, height, minArea) {
      if (minArea <= 1) return mask;
      const visited = new Uint8Array(mask.length);
      const dst = new Uint8Array(mask.length);
      const queue = new Int32Array(mask.length);
      for (let start = 0; start < mask.length; start += 1) {
        if (!mask[start] || visited[start]) continue;
        let head = 0;
        let tail = 0;
        queue[tail++] = start;
        visited[start] = 1;
        while (head < tail) {
          const i = queue[head++];
          const x = i % width;
          const y = Math.floor(i / width);
          const candidates = [
            x > 0 ? i - 1 : -1,
            x < width - 1 ? i + 1 : -1,
            y > 0 ? i - width : -1,
            y < height - 1 ? i + width : -1
          ];
          for (const next of candidates) {
            if (next >= 0 && mask[next] && !visited[next]) {
              visited[next] = 1;
              queue[tail++] = next;
            }
          }
        }
        if (tail >= minArea) {
          for (let i = 0; i < tail; i += 1) dst[queue[i]] = 1;
        }
      }
      return dst;
    }

    function fillEnclosedAreas(mask, width, height) {
      const outside = new Uint8Array(mask.length);
      const queue = new Int32Array(mask.length);
      let head = 0;
      let tail = 0;
      const push = (x, y) => {
        if (x < 0 || x >= width || y < 0 || y >= height) return;
        const i = y * width + x;
        if (mask[i] || outside[i]) return;
        outside[i] = 1;
        queue[tail++] = i;
      };
      for (let x = 0; x < width; x += 1) {
        push(x, 0);
        push(x, height - 1);
      }
      for (let y = 1; y < height - 1; y += 1) {
        push(0, y);
        push(width - 1, y);
      }
      while (head < tail) {
        const i = queue[head++];
        const x = i % width;
        const y = Math.floor(i / width);
        push(x + 1, y);
        push(x - 1, y);
        push(x, y + 1);
        push(x, y - 1);
      }
      const filled = new Uint8Array(mask.length);
      for (let i = 0; i < mask.length; i += 1) filled[i] = mask[i] || !outside[i] ? 1 : 0;
      return filled;
    }

    function subtractCutoutAreas(baseMask, cutoutSource, width, height, minArea) {
      const visited = new Uint8Array(cutoutSource.length);
      const appliedCutoutMask = new Uint8Array(cutoutSource.length);
      const queue = new Int32Array(cutoutSource.length);
      const output = baseMask.slice();
      const areaLimit = Math.max(1, Math.round(minArea || 0));
      let holeCount = 0;
      let holePixels = 0;
      let ignoredHoleCount = 0;
      let tail = 0;
      const visit = (next) => {
        if (!baseMask[next] || !cutoutSource[next] || visited[next]) return;
        visited[next] = 1;
        queue[tail++] = next;
      };
      for (let start = 0; start < cutoutSource.length; start += 1) {
        if (!baseMask[start] || !cutoutSource[start] || visited[start]) continue;
        let head = 0;
        tail = 0;
        queue[tail++] = start;
        visited[start] = 1;
        while (head < tail) {
          const index = queue[head++];
          const x = index % width;
          const y = (index - x) / width;
          if (x > 0) visit(index - 1);
          if (x + 1 < width) visit(index + 1);
          if (y > 0) visit(index - width);
          if (y + 1 < height) visit(index + width);
        }
        if (tail < areaLimit) {
          ignoredHoleCount += 1;
          continue;
        }
        for (let index = 0; index < tail; index += 1) {
          const pixel = queue[index];
          output[pixel] = 0;
          appliedCutoutMask[pixel] = 1;
        }
        holeCount += 1;
        holePixels += tail;
      }
      return { mask: output, cutoutMask: appliedCutoutMask, holeCount, holePixels, ignoredHoleCount };
    }

    function countMask(mask) {
      let count = 0;
      for (let i = 0; i < mask.length; i += 1) count += mask[i];
      return count;
    }

    function analyzeSolidComponents(maskSource, width, height) {
      const mask = maskSource instanceof Uint8Array ? maskSource : new Uint8Array(maskSource);
      const componentMask = new Uint8Array(mask.length);
      const queue = new Int32Array(mask.length);
      const components = [];
      let componentCount = 0;
      let solidPixels = 0;
      let mainPixels = 0;
      let mainSeed = -1;
      let mainComponentIndex = -1;

      for (let start = 0; start < mask.length; start += 1) {
        if (!mask[start] || componentMask[start]) continue;
        let head = 0;
        let tail = 0;
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;
        queue[tail++] = start;
        componentMask[start] = 1;
        while (head < tail) {
          const index = queue[head++];
          const x = index % width;
          const y = (index - x) / width;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          let next;
          if (x > 0) {
            next = index - 1;
            if (mask[next] && !componentMask[next]) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
          if (x + 1 < width) {
            next = index + 1;
            if (mask[next] && !componentMask[next]) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
          if (y > 0) {
            next = index - width;
            if (mask[next] && !componentMask[next]) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
          if (y + 1 < height) {
            next = index + width;
            if (mask[next] && !componentMask[next]) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
        }
        components.push({ seed: start, pixels: tail, minX, minY, maxX, maxY });
        componentCount += 1;
        solidPixels += tail;
        if (tail > mainPixels) {
          mainPixels = tail;
          mainSeed = start;
          mainComponentIndex = components.length - 1;
        }
      }

      if (mainSeed >= 0) {
        for (let index = 0; index < componentMask.length; index += 1) {
          if (componentMask[index]) componentMask[index] = 2;
        }
        let head = 0;
        let tail = 0;
        queue[tail++] = mainSeed;
        componentMask[mainSeed] = 1;
        while (head < tail) {
          const index = queue[head++];
          const x = index % width;
          const y = (index - x) / width;

          let next;
          if (x > 0) {
            next = index - 1;
            if (componentMask[next] === 2) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
          if (x + 1 < width) {
            next = index + 1;
            if (componentMask[next] === 2) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
          if (y > 0) {
            next = index - width;
            if (componentMask[next] === 2) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
          if (y + 1 < height) {
            next = index + width;
            if (componentMask[next] === 2) {
              componentMask[next] = 1;
              queue[tail++] = next;
            }
          }
        }
      }

      return {
        componentMask,
        componentCount,
        components,
        islands: components
          .filter((_, index) => index !== mainComponentIndex)
          .sort((a, b) => a.minY - b.minY || a.minX - b.minX),
        islandCount: Math.max(0, componentCount - 1),
        islandPixels: Math.max(0, solidPixels - mainPixels),
        mainPixels
      };
    }

    function updateSolidIslandAnalysisForJob(processed, params) {
      const target = meshTargetSize({
        width: processed.width,
        height: processed.height,
        modelWidth: processed.modelWidth,
        modelHeight: processed.modelHeight,
        maxMeshPixelsPerMm: Math.min(params.maxMeshPixelsPerMm, 6),
        maxMeshLongestSide: Math.min(params.maxMeshLongestSide, 960),
        maxMeshPixels: Math.min(params.maxMeshPixels, 900000)
      });
      const baseEnabled = Boolean(params.baseEnabled);
      const sourceMask = baseEnabled ? processed.baseMask : processed.wireMask;
      const analysisMask = resampleMaskForMesh(
        sourceMask,
        processed.width,
        processed.height,
        target.width,
        target.height,
        baseEnabled ? 0.5 : 0.18
      );
      const analysis = analyzeSolidComponents(analysisMask, target.width, target.height);
      processed.componentMask = analysis.componentMask;
      processed.componentMaskWidth = target.width;
      processed.componentMaskHeight = target.height;
      processed.solidComponentCount = analysis.componentCount;
      processed.solidIslandCount = analysis.islandCount;
      processed.solidIslandPixels = analysis.islandPixels;
      processed.mainComponentPixels = analysis.mainPixels;
      processed.solidIslands = analysis.islands;

      const pixelsPerMm = Math.max(target.width / processed.modelWidth, target.height / processed.modelHeight);
      const wallRadius = Math.max(1, Math.round((params.minPrintableWall || 1.2) * pixelsPerMm / 2));
      const erodedSolid = erode(analysisMask, target.width, target.height, wallRadius);
      const erodedAnalysis = analyzeSolidComponents(erodedSolid, target.width, target.height);
      let narrowConnectionCount = Math.max(0, erodedAnalysis.componentCount - analysis.componentCount);
      if (analysis.componentCount > 0 && erodedAnalysis.componentCount === 0) narrowConnectionCount = 1;

      const cutoutMask = resampleMaskForMesh(
        processed.wireMask,
        processed.width,
        processed.height,
        target.width,
        target.height,
        0.18
      );
      const cutoutAnalysis = analyzeSolidComponents(cutoutMask, target.width, target.height);
      const minimumHole = params.minPrintableHole || 0.8;
      const smallHoleCount = cutoutAnalysis.components.reduce((count, component) => {
        const areaMm2 = component.pixels / Math.max(1e-6, pixelsPerMm * pixelsPerMm);
        const equivalentDiameter = 2 * Math.sqrt(areaMm2 / Math.PI);
        return count + (equivalentDiameter < minimumHole ? 1 : 0);
      }, 0);

      const outerMask = new Uint8Array(analysisMask.length);
      for (let index = 0; index < outerMask.length; index += 1) {
        outerMask[index] = analysisMask[index] || cutoutMask[index] ? 1 : 0;
      }
      const edgeRadius = Math.max(1, Math.round((params.minPrintableWall || 1.2) * pixelsPerMm));
      const safeOuterMask = erode(outerMask, target.width, target.height, edgeRadius);
      const edgeRiskMask = new Uint8Array(cutoutMask.length);
      for (let index = 0; index < cutoutMask.length; index += 1) {
        edgeRiskMask[index] = cutoutMask[index] && !safeOuterMask[index] ? 1 : 0;
      }
      const edgeRiskAnalysis = analyzeSolidComponents(edgeRiskMask, target.width, target.height);
      processed.printability = {
        narrowConnectionCount,
        smallHoleCount,
        edgeRiskCount: edgeRiskAnalysis.componentCount,
        entityCount: analysis.componentCount,
        minimumWallMm: params.minPrintableWall || 1.2,
        minimumHoleMm: minimumHole
      };
      processed.islandPreviewCanvas = null;
      processed.selectedIslandPreviewCanvas = null;
    }

    function padMask(mask, width, height, padding) {
      const paddedWidth = width + padding * 2;
      const paddedHeight = height + padding * 2;
      const padded = new Uint8Array(paddedWidth * paddedHeight);
      for (let y = 0; y < height; y += 1) {
        padded.set(mask.subarray(y * width, (y + 1) * width), (y + padding) * paddedWidth + padding);
      }
      return { mask: padded, width: paddedWidth, height: paddedHeight, x: padding, y: padding };
    }

    function maskBounds(mask, width, height) {
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          if (!mask[y * width + x]) continue;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
      }
      return maxX >= minX ? { minX, minY, maxX, maxY } : null;
    }

    function rectangularBaseMask(mask, width, height, margin) {
      const bounds = maskBounds(mask, width, height);
      const output = new Uint8Array(mask.length);
      if (!bounds) return output;
      const minX = Math.max(0, Math.floor(bounds.minX - margin));
      const minY = Math.max(0, Math.floor(bounds.minY - margin));
      const maxX = Math.min(width - 1, Math.ceil(bounds.maxX + margin));
      const maxY = Math.min(height - 1, Math.ceil(bounds.maxY + margin));
      for (let y = minY; y <= maxY; y += 1) output.fill(1, y * width + minX, y * width + maxX + 1);
      return output;
    }

    function squareBaseMask(mask, width, height, margin) {
      const bounds = maskBounds(mask, width, height);
      const output = new Uint8Array(mask.length);
      if (!bounds) return output;
      const cx = (bounds.minX + bounds.maxX) / 2;
      const cy = (bounds.minY + bounds.maxY) / 2;
      const halfSide = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY) / 2 + margin;
      const minX = Math.max(0, Math.floor(cx - halfSide));
      const minY = Math.max(0, Math.floor(cy - halfSide));
      const maxX = Math.min(width - 1, Math.ceil(cx + halfSide));
      const maxY = Math.min(height - 1, Math.ceil(cy + halfSide));
      for (let y = minY; y <= maxY; y += 1) output.fill(1, y * width + minX, y * width + maxX + 1);
      return output;
    }

    function circularBaseMask(mask, width, height, margin) {
      const bounds = maskBounds(mask, width, height);
      const output = new Uint8Array(mask.length);
      if (!bounds) return output;
      const cx = (bounds.minX + bounds.maxX) / 2;
      const cy = (bounds.minY + bounds.maxY) / 2;
      let radius = 0;
      for (let y = bounds.minY; y <= bounds.maxY; y += 1) {
        for (let x = bounds.minX; x <= bounds.maxX; x += 1) {
          if (mask[y * width + x]) radius = Math.max(radius, Math.hypot(x - cx, y - cy));
        }
      }
      radius += margin;
      const radiusSq = radius * radius;
      const minX = Math.max(0, Math.floor(cx - radius));
      const minY = Math.max(0, Math.floor(cy - radius));
      const maxX = Math.min(width - 1, Math.ceil(cx + radius));
      const maxY = Math.min(height - 1, Math.ceil(cy + radius));
      for (let y = minY; y <= maxY; y += 1) {
        const dy = y - cy;
        for (let x = minX; x <= maxX; x += 1) {
          const dx = x - cx;
          if (dx * dx + dy * dy <= radiusSq) output[y * width + x] = 1;
        }
      }
      return output;
    }

    function makeBaseRimMask(baseMask, width, height, rimWidthPx) {
      const output = new Uint8Array(baseMask.length);
      if (rimWidthPx <= 0) return output;
      const innerMask = erode(baseMask, width, height, rimWidthPx);
      for (let i = 0; i < baseMask.length; i += 1) {
        if (baseMask[i] && !innerMask[i]) output[i] = 1;
      }
      return output;
    }

    function circularBasePadding(mask, width, height, margin, wireExpansion) {
      const bounds = maskBounds(mask, width, height);
      if (!bounds) return 0;
      const cx = (bounds.minX + bounds.maxX) / 2;
      const cy = (bounds.minY + bounds.maxY) / 2;
      const radius = Math.hypot(
        (bounds.maxX - bounds.minX) / 2 + wireExpansion,
        (bounds.maxY - bounds.minY) / 2 + wireExpansion
      ) + margin;
      return Math.max(
        0,
        Math.ceil(radius - cx),
        Math.ceil(radius - (width - 1 - cx)),
        Math.ceil(radius - cy),
        Math.ceil(radius - (height - 1 - cy))
      );
    }

    function sampleSpline(points) {
      if (points.length < 3) return points.slice();
      const sampled = [];
      for (let i = 0; i < points.length - 1; i += 1) {
        const p0 = points[Math.max(0, i - 1)];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[Math.min(points.length - 1, i + 2)];
        const distance = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const steps = Math.max(8, Math.min(36, Math.ceil(distance * 72)));
        for (let step = i === 0 ? 0 : 1; step <= steps; step += 1) {
          const t = step / steps;
          const t2 = t * t;
          const t3 = t2 * t;
          sampled.push({
            x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
            y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
          });
        }
      }
      return sampled;
    }

    function stampMask(mask, width, height, cx, cy, radius, value) {
      const minX = Math.max(0, Math.floor(cx - radius));
      const minY = Math.max(0, Math.floor(cy - radius));
      const maxX = Math.min(width - 1, Math.ceil(cx + radius));
      const maxY = Math.min(height - 1, Math.ceil(cy + radius));
      const radiusSq = radius * radius;
      for (let y = minY; y <= maxY; y += 1) {
        const dy = y - cy;
        for (let x = minX; x <= maxX; x += 1) {
          const dx = x - cx;
          if (dx * dx + dy * dy <= radiusSq) mask[y * width + x] = value;
        }
      }
    }

    function baseCutToPixel(processed, cut) {
      return {
        x: Math.round(clamp(cut.x, 0, 1) * Math.max(1, processed.width - 1)),
        y: Math.round(clamp(cut.y, 0, 1) * Math.max(1, processed.height - 1))
      };
    }

    function findBaseCutSeed(processed, x, y) {
      const width = processed.width;
      const height = processed.height;
      const ix = clamp(Math.round(x), 0, width - 1);
      const iy = clamp(Math.round(y), 0, height - 1);
      const canCut = (px, py) => {
        if (px < 0 || py < 0 || px >= width || py >= height) return false;
        const index = py * width + px;
        return processed.baseMask[index] && !processed.wireMask[index];
      };
      if (canCut(ix, iy)) return { x: ix, y: iy };
      const radiusLimit = Math.max(3, Math.min(24, Math.round(processed.pixelsPerMm * 0.8)));
      for (let radius = 1; radius <= radiusLimit; radius += 1) {
        for (let dy = -radius; dy <= radius; dy += 1) {
          for (let dx = -radius; dx <= radius; dx += 1) {
            if (Math.abs(dx) !== radius && Math.abs(dy) !== radius) continue;
            const px = ix + dx;
            const py = iy + dy;
            if (canCut(px, py)) return { x: px, y: py };
          }
        }
      }
      return null;
    }

    function deleteBaseRegion(processed, x, y) {
      const seed = findBaseCutSeed(processed, x, y);
      if (!seed) return 0;
      const width = processed.width;
      const height = processed.height;
      const baseMask = processed.baseMask;
      const wireMask = processed.wireMask;
      const frameBounds = processed.frameBounds;
      const visited = new Uint8Array(baseMask.length);
      const region = new Int32Array(baseMask.length);
      let readIndex = 0;
      let regionLength = 0;
      const enqueue = (index) => {
        if (visited[index] || !baseMask[index] || wireMask[index]) return;
        visited[index] = 1;
        region[regionLength] = index;
        regionLength += 1;
      };
      enqueue(seed.y * width + seed.x);
      while (readIndex < regionLength) {
        const index = region[readIndex];
        readIndex += 1;
        const px = index % width;
        const py = (index - px) / width;
        if (frameBounds && (
          px <= frameBounds.minX + 1
          || px >= frameBounds.maxX - 1
          || py <= frameBounds.minY + 1
          || py >= frameBounds.maxY - 1
        )) {
          return 0;
        }
        if (px > 0) enqueue(index - 1);
        if (px + 1 < width) enqueue(index + 1);
        if (py > 0) enqueue(index - width);
        if (py + 1 < height) enqueue(index + width);
      }
      for (let index = 0; index < regionLength; index += 1) {
        const pixelIndex = region[index];
        baseMask[pixelIndex] = 0;
        wireMask[pixelIndex] = 1;
      }
      return regionLength;
    }

    function applyLineEdit(processed, edit) {
      const normalized = edit.kind === "spline" ? sampleSpline(edit.points) : edit.points;
      if (!normalized.length) return;
      const points = normalized.map((point) => edit.space === "processed"
        ? {
            x: clamp(point.x, 0, 1) * (processed.width - 1),
            y: clamp(point.y, 0, 1) * (processed.height - 1)
          }
        : {
            x: processed.contentX + clamp(point.x, 0, 1) * (processed.contentWidth - 1),
            y: processed.contentY + clamp(point.y, 0, 1) * (processed.contentHeight - 1)
          });
      const radius = Math.max(0.75, edit.size * processed.pixelsPerMm / 2);
      const value = edit.kind === "eraser" || edit.kind === "bridge" ? 0 : 1;
      const drawPoint = (point) => stampMask(processed.lineMask, processed.width, processed.height, point.x, point.y, radius, value);
      drawPoint(points[0]);
      for (let i = 1; i < points.length; i += 1) {
        const from = points[i - 1];
        const to = points[i];
        const steps = Math.max(1, Math.ceil(Math.hypot(to.x - from.x, to.y - from.y) / Math.max(1, radius * 0.45)));
        for (let step = 1; step <= steps; step += 1) {
          const t = step / steps;
          drawPoint({ x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t });
        }
      }
    }

    function applyBaseCutsForJob(processed, cuts, baseShape) {
      let removed = 0;
      for (const cut of cuts || []) {
        if (cut.kind === "island" && cut.baseShape && cut.baseShape !== baseShape) continue;
        const point = baseCutToPixel(processed, cut);
        removed += deleteBaseRegion(processed, point.x, point.y);
      }
      return removed;
    }

    function rebuildDerivedMasksForJob(processed, params, baseCuts) {
      const wireRadius = Math.round(params.wireWidth * processed.pixelsPerMm / 2);
      processed.wireMask = wireRadius >= 0
        ? dilate(processed.lineMask, processed.width, processed.height, wireRadius)
        : erode(processed.lineMask, processed.width, processed.height, Math.abs(wireRadius));
      processed.wireMask = smoothMask(processed.wireMask, processed.width, processed.height, 1);
      processed.hollowHoleCount = 0;
      processed.hollowPixels = 0;
      processed.ignoredHoleCount = 0;

      let solidBaseMask;
      if (params.baseShape === "square") {
        solidBaseMask = squareBaseMask(processed.wireMask, processed.width, processed.height, processed.baseMarginPx);
      } else if (params.baseShape === "circle") {
        solidBaseMask = circularBaseMask(processed.wireMask, processed.width, processed.height, processed.baseMarginPx);
      } else if (params.baseShape === "alpha" && processed.hasTransparency) {
        solidBaseMask = dilate(processed.alphaMask, processed.width, processed.height, processed.baseMarginPx);
        solidBaseMask = smoothMask(solidBaseMask, processed.width, processed.height, 1);
      } else {
        solidBaseMask = rectangularBaseMask(processed.wireMask, processed.width, processed.height, processed.baseMarginPx);
      }
      processed.alphaFallback = params.baseShape === "alpha" && !processed.hasTransparency;
      const minHoleAreaPx = Math.max(0, Number(params.minHoleArea) || 0)
        * processed.pixelsPerMm * processed.pixelsPerMm;
      const hollow = subtractCutoutAreas(
        solidBaseMask,
        processed.wireMask,
        processed.width,
        processed.height,
        minHoleAreaPx
      );
      processed.baseMask = hollow.mask;
      processed.wireMask = hollow.cutoutMask;
      const frameBounds = maskBounds(solidBaseMask, processed.width, processed.height);
      processed.frameBounds = frameBounds;
      processed.baseShape = params.baseShape;
      processed.removedBasePixels = applyBaseCutsForJob(processed, baseCuts, params.baseShape);
      processed.hollowHoleCount = hollow.holeCount;
      processed.hollowPixels = hollow.holePixels;
      processed.ignoredHoleCount = hollow.ignoredHoleCount;
      processed.baseRimMask = new Uint8Array(processed.baseMask.length);
      processed.inkPixels = countMask(processed.wireMask);
      processed.basePixels = countMask(processed.baseMask);
      processed.baseRimPixels = countMask(processed.baseRimMask);
      if (frameBounds) {
        const frameWidthPixels = frameBounds.maxX - frameBounds.minX + 1;
        const frameHeightPixels = frameBounds.maxY - frameBounds.minY + 1;
        processed.pixelsPerMm = Math.max(frameWidthPixels, frameHeightPixels) / params.modelMaxMm;
        processed.modelWidth = processed.width / processed.pixelsPerMm;
        processed.modelHeight = processed.height / processed.pixelsPerMm;
        processed.frameWidth = frameWidthPixels / processed.pixelsPerMm;
        processed.frameHeight = frameHeightPixels / processed.pixelsPerMm;
        processed.frameBounds = frameBounds;
      }
      updateSolidIslandAnalysisForJob(processed, params);
      return processed;
    }

    function runProcessJob(job) {
      const params = job.params;
      const imageBytes = job.imageBuffer instanceof Uint8ClampedArray
        ? job.imageBuffer
        : new Uint8ClampedArray(job.imageBuffer);
      const imageData = { data: imageBytes, width: job.contentWidth, height: job.contentHeight };
      const pixelsPerMm = Math.max(job.contentWidth, job.contentHeight) / params.modelMaxMm;
      const cleanupArea = Math.max(2, params.cleanup * params.cleanup * 3);
      const alpha = makeAlphaMask(imageData, job.contentWidth, job.contentHeight);
      let contentMask = makeInkMask(imageData, job.contentWidth, job.contentHeight, params.threshold);
      contentMask = closeMask(contentMask, job.contentWidth, job.contentHeight, params.closePx);
      contentMask = smoothMask(contentMask, job.contentWidth, job.contentHeight, 1);
      contentMask = removeSmallComponents(contentMask, job.contentWidth, job.contentHeight, cleanupArea);
      const baseMarginPx = params.baseEnabled ? Math.max(0, Math.round(params.baseMargin * pixelsPerMm)) : 0;
      const baseClosePx = Math.max(params.closePx, Math.round(baseMarginPx * 0.65));
      const wireRadiusPx = Math.abs(Math.round(params.wireWidth * pixelsPerMm / 2));
      const shapePadding = params.baseEnabled && (params.baseShape === "circle" || params.baseShape === "square")
        ? circularBasePadding(contentMask, job.contentWidth, job.contentHeight, baseMarginPx, wireRadiusPx)
        : 0;
      const padding = Math.max(6, baseMarginPx + wireRadiusPx + params.closePx + 8, shapePadding + params.closePx + 8);
      const padded = padMask(contentMask, job.contentWidth, job.contentHeight, padding);
      const paddedAlpha = padMask(alpha.mask, job.contentWidth, job.contentHeight, padding);
      const processed = {
        width: padded.width,
        height: padded.height,
        imageData: imageBytes,
        sourceLineMask: padded.mask,
        lineMask: padded.mask.slice(),
        alphaMask: paddedAlpha.mask,
        hasTransparency: alpha.hasTransparency,
        alphaFallback: false,
        wireMask: new Uint8Array(padded.mask.length),
        baseMask: new Uint8Array(padded.mask.length),
        baseRimMask: new Uint8Array(padded.mask.length),
        contentX: padded.x,
        contentY: padded.y,
        contentWidth: job.contentWidth,
        contentHeight: job.contentHeight,
        pixelsPerMm,
        baseMarginPx,
        baseClosePx,
        inkPixels: 0,
        basePixels: 0,
        baseRimPixels: 0,
        hollowHoleCount: 0,
        hollowPixels: 0,
        ignoredHoleCount: 0,
        removedBasePixels: 0,
        componentMask: new Uint8Array(0),
        componentMaskWidth: 0,
        componentMaskHeight: 0,
        solidComponentCount: 0,
        solidIslandCount: 0,
        solidIslandPixels: 0,
        solidIslands: [],
        mainComponentPixels: 0,
        printability: null,
        frameWidth: 0,
        frameHeight: 0,
        frameBounds: null,
        modelWidth: padded.width / pixelsPerMm,
        modelHeight: padded.height / pixelsPerMm
      };
      for (const edit of job.lineEdits || []) applyLineEdit(processed, edit);
      rebuildDerivedMasksForJob(processed, params, job.baseCuts || []);
      return { ok: true, maskRevision: job.maskRevision, processed };
    }

    function currentProcessingParams() {
      return {
        modelMaxMm: Number(controls.modelSize.value),
        threshold: Number(controls.threshold.value),
        cleanup: Number(controls.cleanup.value),
        closePx: Number(controls.closeStrength.value),
        minHoleArea: Number(controls.minHoleArea.value),
        wireWidth: Number(controls.wireWidth.value),
        baseEnabled: true,
        baseShape: controls.baseShape.value,
        baseMargin: Number(controls.baseMargin.value),
        baseRimWidth: 0,
        maxMeshPixelsPerMm: MAX_MESH_PIXELS_PER_MM,
        maxMeshLongestSide: MAX_MESH_LONGEST_SIDE,
        maxMeshPixels: MAX_MESH_PIXELS,
        minPrintableWall: MIN_PRINTABLE_WALL_MM,
        minPrintableHole: MIN_PRINTABLE_HOLE_MM
      };
    }

    function rebuildDerivedMasks(processed) {
      processed.maskPreviewCanvas = null;
      processed.islandPreviewCanvas = null;
      rebuildDerivedMasksForJob(processed, currentProcessingParams(), state.baseCuts);
    }

    function updateProcessedMetrics(processed) {
      const requestedResolution = Number(controls.resolution.value) || 0;
      const sampledResolution = Math.max(processed.contentWidth, processed.contentHeight);
      const samplingMode = sampledResolution + 2 < requestedResolution ? "快速" : "精细";
      controls.pixelMetric.textContent = `${processed.width} x ${processed.height} px · ${samplingMode}`;
      const islandCount = processed.solidIslandCount || 0;
      controls.lineMetric.textContent = `镂空 ${(processed.inkPixels / processed.wireMask.length * 100).toFixed(1)}% / 区域 ${processed.hollowHoleCount || 0} 个 / 孤岛 ${islandCount} 个`;
      controls.lineMetric.classList.toggle("danger", islandCount > 0);
      controls.lineMetric.title = islandCount > 0 ? `检测到 ${islandCount} 个未与主体连通的实体` : "当前结构已连成一体";
      const frameWidth = processed.frameWidth || processed.modelWidth;
      const frameHeight = processed.frameHeight || processed.modelHeight;
      controls.modelMetric.textContent = `${frameWidth.toFixed(1)} x ${frameHeight.toFixed(1)} mm`;
      controls.summarySize.textContent = `${frameWidth.toFixed(1)} x ${frameHeight.toFixed(1)} mm`;
      controls.summaryHeight.textContent = `${Number(controls.wireHeight.value).toFixed(2)} mm`;
    }

    function cancelAutoBridgeProposal(shouldRender = true) {
      state.autoBridgeProposal = null;
      controls.bridgeConfirmActions.hidden = true;
      controls.autoBridgeButton.hidden = false;
      if (shouldRender) renderPreview();
    }

    function updateIslandControls(processed = state.processed) {
      const count = processed?.solidIslandCount || 0;
      state.selectedIslandIndex = count ? clamp(state.selectedIslandIndex, 0, count - 1) : 0;
      controls.islandActions.hidden = count === 0;
      controls.islandCounter.textContent = count ? `孤岛 ${state.selectedIslandIndex + 1} / ${count}` : "孤岛 0 / 0";
      controls.previousIslandButton.disabled = count < 2;
      controls.nextIslandButton.disabled = count < 2;
      controls.autoBridgeButton.disabled = count === 0;
      controls.deleteIslandButton.disabled = count === 0;
      controls.bridgeConfirmActions.hidden = !state.autoBridgeProposal;
      controls.autoBridgeButton.hidden = Boolean(state.autoBridgeProposal);
    }

    function updatePrintabilityPanel(processed = state.processed) {
      if (!processed) {
        controls.printabilityBadge.className = "printability-badge";
        controls.printabilityBadge.textContent = "等待图片";
        controls.printabilityList.innerHTML = "<li>上传图片后检查孤岛、窄连接、孔径和边缘距离</li>";
        updateIslandControls(null);
        updateWorkspaceState();
        return;
      }
      const report = processed.printability || {};
      const issues = [];
      const islandCount = processed.solidIslandCount || 0;
      if (islandCount) issues.push({ level: "danger", text: `${islandCount} 个孤岛未与主体连接` });
      if (report.narrowConnectionCount) issues.push({ level: "warning", text: `${report.narrowConnectionCount} 处连接可能窄于 ${MIN_PRINTABLE_WALL_MM.toFixed(1)} mm` });
      if (report.smallHoleCount) issues.push({ level: "warning", text: `${report.smallHoleCount} 个孔的等效直径可能小于 ${MIN_PRINTABLE_HOLE_MM.toFixed(1)} mm` });
      if (report.edgeRiskCount) issues.push({ level: "warning", text: `${report.edgeRiskCount} 个镂空区域距离外边不足 ${MIN_PRINTABLE_WALL_MM.toFixed(1)} mm` });
      if (Number(controls.wireHeight.value) < MIN_MODEL_THICKNESS_MM) {
        issues.push({ level: "warning", text: `模型厚度低于建议值 ${MIN_MODEL_THICKNESS_MM.toFixed(1)} mm` });
      }
      if (processed.alphaFallback) issues.push({ level: "warning", text: "图片没有有效透明通道，透明轮廓已回退为自动矩形外框" });

      const danger = issues.some((issue) => issue.level === "danger");
      controls.printabilityBadge.className = `printability-badge ${danger ? "danger" : issues.length ? "warning" : "good"}`;
      controls.printabilityBadge.textContent = danger ? "需要处理" : issues.length ? "建议检查" : "结构正常";
      const issueRows = issues.map((issue) => `<li class="${issue.level}">${issue.text}</li>`);
      issueRows.push(`<li class="good">当前共 ${report.entityCount || 1} 个连通实体</li>`);
      controls.printabilityList.innerHTML = issues.length
        ? issueRows.join("")
        : `<li class="good">未发现低于当前基准的明显结构风险，当前共 ${report.entityCount || 1} 个连通实体</li>`;
      updateIslandControls(processed);
      updateWorkspaceState();
    }

    function selectIsland(offset) {
      const processed = state.processed;
      const count = processed?.solidIslandCount || 0;
      if (!count) return;
      cancelAutoBridgeProposal(false);
      state.selectedIslandIndex = (state.selectedIslandIndex + offset + count) % count;
      processed.selectedIslandPreviewCanvas = null;
      updateIslandControls(processed);
      renderPreview();
    }

    function deleteSelectedIsland() {
      const processed = state.processed;
      const island = processed?.solidIslands?.[state.selectedIslandIndex];
      const width = processed?.componentMaskWidth || 0;
      const height = processed?.componentMaskHeight || 0;
      if (!processed || !island || !width || !height) {
        showToast("当前没有可删除的孤岛");
        return;
      }
      const analysisX = island.seed % width;
      const analysisY = Math.floor(island.seed / width);
      const point = {
        x: analysisX / Math.max(1, width - 1) * (processed.width - 1),
        y: analysisY / Math.max(1, height - 1) * (processed.height - 1)
      };
      const seed = findBaseCutSeed(processed, point.x, point.y);
      if (!seed) {
        showToast("无法定位该孤岛，请重新识别后再试");
        return;
      }
      const islandCountBefore = processed.solidIslandCount || 0;
      recordLineEditHistory();
      cancelAutoBridgeProposal(false);
      state.baseCuts.push({
        kind: "island",
        baseShape: processed.baseShape,
        x: seed.x / Math.max(1, processed.width - 1),
        y: seed.y / Math.max(1, processed.height - 1)
      });
      rebuildManualLinework();
      const remaining = state.processed?.solidIslandCount || 0;
      showToast(remaining < islandCountBefore
        ? `已删除孤岛，剩余 ${remaining} 个`
        : "孤岛删除未生效，请重新识别后再试");
    }

    function cloneLineEdits(edits = state.lineEdits) {
      return edits.map((edit) => ({
        kind: edit.kind,
        size: edit.size,
        space: edit.space,
        points: edit.points.map((point) => ({ x: point.x, y: point.y }))
      }));
    }

    function cloneBaseCuts(cuts = state.baseCuts) {
      return cuts.map((cut) => ({
        kind: cut.kind,
        baseShape: cut.baseShape,
        x: cut.x,
        y: cut.y
      }));
    }

    function currentEditSnapshot() {
      return {
        lineEdits: cloneLineEdits(),
        baseCuts: cloneBaseCuts()
      };
    }

    function cloneEditSnapshot(snapshot = currentEditSnapshot()) {
      if (Array.isArray(snapshot)) {
        return {
          lineEdits: cloneLineEdits(snapshot),
          baseCuts: cloneBaseCuts()
        };
      }
      return {
        lineEdits: cloneLineEdits(snapshot.lineEdits || []),
        baseCuts: cloneBaseCuts(snapshot.baseCuts || [])
      };
    }

    function restoreEditSnapshot(snapshot) {
      const restored = cloneEditSnapshot(snapshot);
      state.lineEdits = restored.lineEdits;
      state.baseCuts = restored.baseCuts;
      state.editor.selectedSplineIndex = null;
      state.editor.pointDrag = null;
      rebuildManualLinework();
    }

    function recordLineEditHistory(snapshot = currentEditSnapshot()) {
      state.editHistory.push(cloneEditSnapshot(snapshot));
      if (state.editHistory.length > 80) state.editHistory.shift();
      state.redoHistory = [];
    }

    function undoLineEdit() {
      if (!state.editHistory.length) return;
      state.redoHistory.push(currentEditSnapshot());
      restoreEditSnapshot(state.editHistory.pop());
    }

    function redoLineEdit() {
      if (!state.redoHistory.length) return;
      state.editHistory.push(currentEditSnapshot());
      restoreEditSnapshot(state.redoHistory.pop());
    }

    function rebuildManualLinework() {
      const processed = state.processed;
      if (!processed) return;
      invalidateModel();
      cancelAutoBridgeProposal(false);
      processed.lineMask = processed.sourceLineMask.slice();
      state.lineEdits.forEach((edit) => applyLineEdit(processed, edit));
      rebuildDerivedMasks(processed);
      state.maskRevision += 1;
      state.workerMaskRevision = -1;
      updateProcessedMetrics(processed);
      updatePrintabilityPanel(processed);
      const islandCount = processed.solidIslandCount || 0;
      controls.statusText.textContent = islandCount > 0
        ? `检测到 ${islandCount} 个孤岛，可使用加桥工具`
        : "结构已连成一体";
      if (state.editor.selectedSplineIndex !== null && !state.lineEdits[state.editor.selectedSplineIndex]) {
        state.editor.selectedSplineIndex = null;
      }
      updateEditorControls();
      updateExportUi();
      renderPreview();
    }

    function normalizeProcessedResult(result) {
      const value = result.processed;
      const uint8 = (source) => source instanceof Uint8Array ? source : new Uint8Array(source);
      const rgba = value.imageData instanceof Uint8ClampedArray
        ? value.imageData
        : new Uint8ClampedArray(value.imageData);
      return {
        ...value,
        imageData: { data: rgba, width: value.contentWidth, height: value.contentHeight },
        sourceLineMask: uint8(value.sourceLineMask),
        lineMask: uint8(value.lineMask),
        alphaMask: uint8(value.alphaMask),
        wireMask: uint8(value.wireMask),
        baseMask: uint8(value.baseMask),
        baseRimMask: uint8(value.baseRimMask),
        componentMask: uint8(value.componentMask)
      };
    }

    function processSource(options = {}) {
      if (!state.source) return;
      updateLabels();
      invalidateModel();
      const crop = detectCropBox(state.source);
      const requestedSample = Number(controls.resolution.value);
      const maxSample = Number(options.resolutionOverride)
        || (controls.fastPreview.checked ? Math.min(requestedSample, DRAFT_PREVIEW_RESOLUTION) : requestedSample);
      const scale = maxSample / Math.max(crop.width, crop.height);
      const contentWidth = Math.max(24, Math.round(crop.width * scale));
      const contentHeight = Math.max(24, Math.round(crop.height * scale));
      let imageData;
      try {
        imageData = getImageData(state.source, contentWidth, contentHeight, crop);
      } catch (error) {
        state.paramsDirty = true;
        updateParameterCommitUi();
        controls.statusText.textContent = error?.message || "无法创建高采样画布";
        controls.statsText.textContent = "内存不足，请降低细节采样后重试";
        showToast("高采样画布创建失败，请降低采样率");
        return;
      }
      const maskRevision = state.maskRevision + 1;
      const processId = state.processingId + 1;
      state.processingId = processId;
      state.processing = true;
      controls.statusText.textContent = `${options.exportPass ? "导出前精细处理" : "正在后台处理"} ${contentWidth} × ${contentHeight} 像素`;
      controls.statsText.textContent = "正在识别黑色镂空并计算白色实体连通性，页面仍可操作";
      updateParameterCommitUi();
      const job = {
        imageBuffer: imageData.data.buffer,
        contentWidth,
        contentHeight,
        params: currentProcessingParams(),
        lineEdits: cloneLineEdits(),
        baseCuts: cloneBaseCuts(),
        maskRevision
      };
      const finish = (result, fromWorker) => {
        if (processId !== state.processingId) return;
        if (!result?.ok) throw new Error(result?.error || "图片处理失败");
        const processed = normalizeProcessedResult(result);
        state.processed = processed;
        state.selectedIslandIndex = 0;
        state.autoBridgeProposal = null;
        state.maskRevision = result.maskRevision;
        state.workerMaskRevision = fromWorker ? result.maskRevision : -1;
        state.processing = false;
        state.paramsDirty = false;
        updateProcessedMetrics(processed);
        updatePrintabilityPanel(processed);
        updateEditorControls();
        renderPreview();
        updateParameterCommitUi();
        const islandCount = processed.solidIslandCount || 0;
        controls.statusText.textContent = islandCount > 0
          ? `检测到 ${islandCount} 个孤岛，可使用加桥工具`
          : "黑色镂空识别完成，白色实体结构连通";
        const ignoredText = processed.ignoredHoleCount
          ? `；过滤 ${processed.ignoredHoleCount} 个小孔`
          : "";
        const islandText = islandCount > 0 ? `；检测到 ${islandCount} 个孤岛` : "";
        controls.statsText.textContent = `识别到 ${processed.hollowHoleCount || 0} 个黑色镂空区域${ignoredText}${islandText}；3D 网格最高 ${MAX_MESH_PIXELS_PER_MM} 像素/mm`;
        showToast(islandCount > 0 ? `发现 ${islandCount} 个孤岛：红色为孤岛，橙色为当前选择` : "参数已确认，预览已更新");
        if (typeof options.onComplete === "function") options.onComplete();
      };
      const fail = (error) => {
        if (processId !== state.processingId) return;
        state.processing = false;
        state.paramsDirty = true;
        updateParameterCommitUi();
        controls.statusText.textContent = error?.message || "图片处理失败";
        controls.statsText.textContent = "处理失败，请降低采样率后重试";
        showToast(error?.message || "图片处理失败");
      };
      if (window.Worker) {
        runWorkerTask("process", job, [job.imageBuffer])
          .then((result) => finish(result, true))
          .catch(fail);
        return;
      }
      requestAnimationFrame(() => {
        try {
          finish(runProcessJob(job), false);
        } catch (error) {
          fail(error);
        }
      });
    }

    function ensureFineResolutionForExport(resume) {
      const processed = state.processed;
      if (!processed) return false;
      const requested = Number(controls.resolution.value) || 0;
      const actual = Math.max(processed.contentWidth, processed.contentHeight);
      if (actual + 2 >= requested) return true;
      controls.statusText.textContent = `导出前切换到 ${requested} 像素精细采样`;
      controls.statsText.textContent = "正在重新识别完整细节，完成后会自动继续生成";
      processSource({ resolutionOverride: requested, exportPass: true, onComplete: resume });
      return false;
    }

    function frameFor(rect, width, height) {
      const padding = Math.min(42, Math.max(18, rect.width * 0.035));
      const fit = Math.min((rect.width - padding * 2) / width, (rect.height - padding * 2) / height);
      return {
        fit,
        x: (rect.width - width * fit) / 2,
        y: (rect.height - height * fit) / 2,
        width: width * fit,
        height: height * fit
      };
    }

    function previewFrameFor(rect, width, height) {
      const base = frameFor(rect, width, height);
      const fit = base.fit * state.view.zoom;
      return {
        fit,
        x: (rect.width - width * fit) / 2 + state.view.x,
        y: (rect.height - height * fit) / 2 + state.view.y,
        width: width * fit,
        height: height * fit
      };
    }

    function resetPreviewView() {
      state.view.x = 0;
      state.view.y = 0;
      state.view.zoom = 1;
      renderPreview();
    }

    function setPreviewZoom(nextZoom, clientX, clientY) {
      const previousZoom = state.view.zoom;
      const zoom = clamp(nextZoom, 0.5, 8);
      if (zoom === previousZoom) return;
      const rect = controls.previewPane.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const focusX = Number.isFinite(clientX) ? clientX - (rect.left || 0) : centerX;
      const focusY = Number.isFinite(clientY) ? clientY - (rect.top || 0) : centerY;
      const ratio = zoom / previousZoom;
      state.view.x = focusX - centerX - (focusX - centerX - state.view.x) * ratio;
      state.view.y = focusY - centerY - (focusY - centerY - state.view.y) * ratio;
      state.view.zoom = zoom;
      renderPreview();
    }

    function maskCanvas(processed, mode) {
      if (mode === "line" && processed.maskPreviewCanvas) return processed.maskPreviewCanvas;
      const canvas = document.createElement("canvas");
      canvas.width = processed.width;
      canvas.height = processed.height;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(processed.width, processed.height);
      const baseRimMask = processed.baseRimMask || new Uint8Array(processed.baseMask.length);
      for (let i = 0, p = 0; i < image.data.length; i += 4, p += 1) {
        let r = 255, g = 255, b = 255, a = 0;
        if (mode !== "wire" && processed.baseMask[p]) {
          r = 234; g = 223; b = 193; a = 238;
        }
        if (mode !== "wire" && baseRimMask[p]) {
          r = 16; g = 31; b = 32; a = 255;
        }
        if (processed.wireMask[p]) {
          r = 16; g = 31; b = 32; a = 255;
        }
        image.data[i] = r;
        image.data[i + 1] = g;
        image.data[i + 2] = b;
        image.data[i + 3] = a;
      }
      ctx.putImageData(image, 0, 0);
      if (mode === "line") processed.maskPreviewCanvas = canvas;
      return canvas;
    }

    function islandCanvas(processed) {
      if (processed.islandPreviewCanvas) return processed.islandPreviewCanvas;
      const width = processed.componentMaskWidth || 0;
      const height = processed.componentMaskHeight || 0;
      const mask = processed.componentMask;
      if (!width || !height || !mask?.length) return null;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(width, height);
      for (let index = 0, offset = 0; index < mask.length; index += 1, offset += 4) {
        if (mask[index] !== 2) continue;
        const x = index % width;
        const y = (index - x) / width;
        const boundary = x === 0 || x + 1 === width || y === 0 || y + 1 === height
          || mask[index - 1] !== 2 || mask[index + 1] !== 2
          || mask[index - width] !== 2 || mask[index + width] !== 2;
        image.data[offset] = 218;
        image.data[offset + 1] = boundary ? 38 : 54;
        image.data[offset + 2] = boundary ? 38 : 48;
        image.data[offset + 3] = boundary ? 235 : 138;
      }
      ctx.putImageData(image, 0, 0);
      processed.islandPreviewCanvas = canvas;
      return canvas;
    }

    function selectedIslandCanvas(processed) {
      const island = processed.solidIslands?.[state.selectedIslandIndex];
      if (!island) return null;
      if (processed.selectedIslandPreviewCanvas?.islandIndex === state.selectedIslandIndex) {
        return processed.selectedIslandPreviewCanvas.canvas;
      }
      const width = processed.componentMaskWidth;
      const height = processed.componentMaskHeight;
      const mask = processed.componentMask;
      if (mask[island.seed] !== 2) return null;
      const visited = new Uint8Array(mask.length);
      const queue = new Int32Array(mask.length);
      let head = 0;
      let tail = 0;
      queue[tail++] = island.seed;
      visited[island.seed] = 1;
      while (head < tail) {
        const index = queue[head++];
        const x = index % width;
        const y = (index - x) / width;
        const visit = (next) => {
          if (mask[next] !== 2 || visited[next]) return;
          visited[next] = 1;
          queue[tail++] = next;
        };
        if (x > 0) visit(index - 1);
        if (x + 1 < width) visit(index + 1);
        if (y > 0) visit(index - width);
        if (y + 1 < height) visit(index + width);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(width, height);
      for (let index = 0; index < visited.length; index += 1) {
        if (!visited[index]) continue;
        const offset = index * 4;
        image.data[offset] = 242;
        image.data[offset + 1] = 148;
        image.data[offset + 2] = 24;
        image.data[offset + 3] = 210;
      }
      ctx.putImageData(image, 0, 0);
      processed.selectedIslandPreviewCanvas = { islandIndex: state.selectedIslandIndex, canvas };
      return canvas;
    }

    function drawIslandOverlay(ctx, processed, rect) {
      if (!(processed.solidIslandCount > 0)) return;
      const bitmap = islandCanvas(processed);
      if (!bitmap) return;
      const frame = previewFrameFor(rect, processed.width, processed.height);
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(bitmap, frame.x, frame.y, frame.width, frame.height);
      const selected = selectedIslandCanvas(processed);
      if (selected) ctx.drawImage(selected, frame.x, frame.y, frame.width, frame.height);
      ctx.restore();
    }

    function buildAutoBridgeProposal(processed, islandIndex) {
      const width = processed.componentMaskWidth;
      const height = processed.componentMaskHeight;
      const mask = processed.componentMask;
      const island = processed.solidIslands?.[islandIndex];
      if (!width || !height || !island || mask[island.seed] !== 2) return null;

      const target = new Uint8Array(mask.length);
      const queue = new Int32Array(mask.length);
      const previous = new Int32Array(mask.length);
      previous.fill(-1);
      let head = 0;
      let tail = 0;
      queue[tail++] = island.seed;
      target[island.seed] = 1;
      previous[island.seed] = -2;
      while (head < tail) {
        const index = queue[head++];
        const x = index % width;
        const y = (index - x) / width;
        const visitIsland = (next) => {
          if (mask[next] !== 2 || target[next]) return;
          target[next] = 1;
          previous[next] = -2;
          queue[tail++] = next;
        };
        if (x > 0) visitIsland(index - 1);
        if (x + 1 < width) visitIsland(index + 1);
        if (y > 0) visitIsland(index - width);
        if (y + 1 < height) visitIsland(index + width);
      }

      head = 0;
      let found = -1;
      const offsets = [-1, 1, -width, width, -width - 1, -width + 1, width - 1, width + 1];
      while (head < tail && found < 0) {
        const index = queue[head++];
        const x = index % width;
        const y = (index - x) / width;
        for (const offset of offsets) {
          const next = index + offset;
          if (next < 0 || next >= mask.length || previous[next] !== -1) continue;
          const nx = next % width;
          const ny = (next - nx) / width;
          if (Math.abs(nx - x) > 1 || Math.abs(ny - y) > 1) continue;
          if (mask[next] === 2 && !target[next]) continue;
          previous[next] = index;
          if (mask[next] === 1) {
            found = next;
            break;
          }
          queue[tail++] = next;
        }
      }
      if (found < 0) return null;

      const rawPath = [];
      let cursor = found;
      while (cursor >= 0) {
        rawPath.push(cursor);
        const prior = previous[cursor];
        if (prior === -2) break;
        cursor = prior;
      }
      rawPath.reverse();
      const pixelsPerMm = Math.max(width / processed.modelWidth, height / processed.modelHeight);
      const stride = Math.max(2, Math.round(pixelsPerMm * 0.35));
      const path = rawPath.filter((_, index) => index === 0 || index === rawPath.length - 1 || index % stride === 0);
      return {
        kind: "bridge",
        size: Math.max(MIN_PRINTABLE_WALL_MM, state.editor.bridgeSize),
        space: "processed",
        points: path.map((index) => ({
          x: (index % width) / Math.max(1, width - 1),
          y: Math.floor(index / width) / Math.max(1, height - 1)
        })),
        targetValid: true,
        islandCountBefore: processed.solidIslandCount || 0,
        auto: true
      };
    }

    function previewAutoBridge() {
      const processed = state.processed;
      if (!processed?.solidIslandCount) return;
      const proposal = buildAutoBridgeProposal(processed, state.selectedIslandIndex);
      if (!proposal) {
        showToast("没有找到可连接到主体的路径");
        return;
      }
      state.autoBridgeProposal = proposal;
      updateIslandControls(processed);
      renderPreview();
      showToast("已生成虚线桥方案，确认后才会修改模型");
    }

    function confirmAutoBridge() {
      const proposal = state.autoBridgeProposal;
      if (!proposal) return;
      recordLineEditHistory();
      state.lineEdits.push({
        kind: "bridge",
        size: proposal.size,
        space: proposal.space,
        points: proposal.points.map((point) => ({ x: point.x, y: point.y }))
      });
      const islandCountBefore = proposal.islandCountBefore;
      state.autoBridgeProposal = null;
      rebuildManualLinework();
      const remaining = state.processed?.solidIslandCount || 0;
      showToast(remaining < islandCountBefore
        ? `自动桥已添加，剩余 ${remaining} 个孤岛`
        : "桥已添加但孤岛仍存在，可加宽后重试");
    }

    function sourceCanvas(processed) {
      if (processed.sourcePreviewCanvas) return processed.sourcePreviewCanvas;
      const canvas = document.createElement("canvas");
      canvas.width = processed.width;
      canvas.height = processed.height;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(processed.width, processed.height);
      for (let i = 0; i < image.data.length; i += 4) {
        image.data[i] = 255;
        image.data[i + 1] = 255;
        image.data[i + 2] = 255;
        image.data[i + 3] = 255;
      }
      const source = processed.imageData.data;
      for (let y = 0; y < processed.contentHeight; y += 1) {
        const from = y * processed.contentWidth * 4;
        const to = ((y + processed.contentY) * processed.width + processed.contentX) * 4;
        image.data.set(source.subarray(from, from + processed.contentWidth * 4), to);
      }
      ctx.putImageData(image, 0, 0);
      processed.sourcePreviewCanvas = canvas;
      return canvas;
    }

    function drawBitmap(ctx, bitmap, rect, width, height) {
      const frame = previewFrameFor(rect, width, height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.fillStyle = "rgba(255,255,255,0.86)";
      ctx.fillRect(frame.x - 12, frame.y - 12, frame.width + 24, frame.height + 24);
      ctx.strokeStyle = "rgba(20,34,36,0.14)";
      ctx.strokeRect(frame.x - 12, frame.y - 12, frame.width + 24, frame.height + 24);
      ctx.drawImage(bitmap, frame.x, frame.y, frame.width, frame.height);
    }

    function drawEditorOverlay(ctx, processed, rect) {
      const draft = state.autoBridgeProposal || state.editor.draft;
      const selected = state.lineEdits[state.editor.selectedSplineIndex];
      if (!draft?.points.length && selected?.kind !== "spline") return;
      const frame = previewFrameFor(rect, processed.width, processed.height);
      const toScreen = (point, space = "content") => ({
        x: frame.x + (space === "processed"
          ? point.x * (processed.width - 1)
          : processed.contentX + point.x * (processed.contentWidth - 1)) * frame.fit,
        y: frame.y + (space === "processed"
          ? point.y * (processed.height - 1)
          : processed.contentY + point.y * (processed.contentHeight - 1)) * frame.fit
      });
      const drawPath = (points, color, width, space) => {
        if (!points.length) return;
        const first = toScreen(points[0], space);
        ctx.beginPath();
        ctx.moveTo(first.x, first.y);
        for (let i = 1; i < points.length; i += 1) {
          const point = toScreen(points[i], space);
          ctx.lineTo(point.x, point.y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
      };
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (selected?.kind === "spline") {
        ctx.setLineDash?.([5, 5]);
        drawPath(sampleSpline(selected.points), "rgba(220, 130, 28, 0.98)", Math.max(2, selected.size * processed.pixelsPerMm * frame.fit + 2), selected.space);
        ctx.setLineDash?.([]);
        if (typeof ctx.arc === "function") {
          ctx.strokeStyle = "rgba(220, 130, 28, 0.98)";
          selected.points.forEach((point, index) => {
            const marker = toScreen(point, selected.space);
            ctx.beginPath();
            ctx.arc(marker.x, marker.y, state.editor.pointDrag?.pointIndex === index ? 6 : 5, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.stroke();
          });
        }
      }
      if (draft?.points.length) {
        if (draft.auto) ctx.setLineDash?.([8, 6]);
        const splinePoints = draft.kind === "spline" && state.editor.hover
          ? [...draft.points, state.editor.hover]
          : draft.points;
        const points = draft.kind === "spline" ? sampleSpline(splinePoints) : draft.points;
        const color = draft.kind === "eraser"
          ? "rgba(206, 83, 74, 0.92)"
          : draft.kind === "bridge"
            ? draft.targetValid ? "rgba(24, 150, 88, 0.98)" : "rgba(220, 130, 28, 0.98)"
            : "rgba(17, 153, 143, 0.94)";
        drawPath(points, color, Math.max(1.5, draft.size * processed.pixelsPerMm * frame.fit), draft.space);
        const first = toScreen(points[0], draft.space);
        if (points.length === 1 && typeof ctx.arc === "function") {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(first.x, first.y, Math.max(1.5, draft.size * processed.pixelsPerMm * frame.fit) / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        if (draft.kind === "spline" && typeof ctx.arc === "function") {
          ctx.strokeStyle = color;
          ctx.fillStyle = "#ffffff";
          draft.points.forEach((point) => {
            const marker = toScreen(point, draft.space);
            ctx.beginPath();
            ctx.arc(marker.x, marker.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
        }
        if (draft.kind === "bridge" && points.length > 1 && typeof ctx.arc === "function") {
          const end = toScreen(points[points.length - 1], draft.space);
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = color;
          [first, end].forEach((marker) => {
            ctx.beginPath();
            ctx.arc(marker.x, marker.y, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
        }
        if (draft.auto) ctx.setLineDash?.([]);
      }
      ctx.restore();
    }

    function renderPreview() {
      const canvas = controls.previewCanvas;
      const rect = controls.previewPane.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      const p = state.processed;
      if (!p) return;

      if (state.previewMode === "image") {
        drawBitmap(ctx, sourceCanvas(p), rect, p.width, p.height);
        return;
      }
      if (state.previewMode === "line") {
        drawBitmap(ctx, maskCanvas(p, "line"), rect, p.width, p.height);
        drawIslandOverlay(ctx, p, rect);
        drawEditorOverlay(ctx, p, rect);
        return;
      }
      drawBitmap(ctx, maskCanvas(p, "line"), rect, p.width, p.height);
    }

    function buildStlPreviewMesh(buffer, baseHeight) {
      const view = new DataView(buffer);
      const triangleCount = view.getUint32(80, true);
      const positions = new Float32Array(triangleCount * 9);
      const normals = new Float32Array(triangleCount * 9);
      const material = new Uint8Array(triangleCount);
      const vertexMaterial = new Float32Array(triangleCount * 3);
      let minX = Infinity, minY = Infinity, minZ = Infinity;
      let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

      for (let t = 0; t < triangleCount; t += 1) {
        const triangleOffset = 84 + t * 50;
        const normalX = view.getFloat32(triangleOffset, true);
        const normalY = view.getFloat32(triangleOffset + 4, true);
        const normalZ = view.getFloat32(triangleOffset + 8, true);
        let offset = triangleOffset + 12;
        let avgZ = 0;
        for (let v = 0; v < 3; v += 1) {
          const x = view.getFloat32(offset, true); offset += 4;
          const y = view.getFloat32(offset, true); offset += 4;
          const z = view.getFloat32(offset, true); offset += 4;
          const i = t * 9 + v * 3;
          positions[i] = x;
          positions[i + 1] = y;
          positions[i + 2] = z;
          normals[i] = normalX;
          normals[i + 1] = normalY;
          normals[i + 2] = normalZ;
          avgZ += z;
          minX = Math.min(minX, x); minY = Math.min(minY, y); minZ = Math.min(minZ, z);
          maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); maxZ = Math.max(maxZ, z);
        }
        material[t] = avgZ / 3 <= baseHeight + 0.08 ? 0 : 1;
        const materialOffset = t * 3;
        vertexMaterial[materialOffset] = material[t];
        vertexMaterial[materialOffset + 1] = material[t];
        vertexMaterial[materialOffset + 2] = material[t];
      }

      const sizeX = maxX - minX;
      const sizeY = maxY - minY;
      const sizeZ = maxZ - minZ;
      return {
        positions,
        normals,
        material,
        vertexMaterial,
        triangleCount,
        center: [(minX + maxX) / 2, (minY + maxY) / 2, (minZ + maxZ) / 2],
        radius: Math.max(sizeX, sizeY, sizeZ, 1) / 2,
        bounds: { minX, minY, minZ, maxX, maxY, maxZ }
      };
    }

    function requestStlRender() {
      if (!state.stlMesh || state.stlRenderQueued) return;
      state.stlRenderQueued = true;
      requestAnimationFrame(() => {
        state.stlRenderQueued = false;
        renderStlPreview();
      });
    }

    function shadeRgb(rgb, shade) {
      const ambient = 0.18;
      const gain = ambient + shade * (1 - ambient);
      return `rgb(${Math.round(rgb[0] * gain)}, ${Math.round(rgb[1] * gain)}, ${Math.round(rgb[2] * gain)})`;
    }

    function isPreviewFrontFace(a, b, c) {
      const signedArea = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      return signedArea < -0.025;
    }

    function compileStlShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader) || "WebGL shader compilation failed";
        gl.deleteShader(shader);
        throw new Error(message);
      }
      return shader;
    }

    function createStlGlState(canvas) {
      const gl = canvas.getContext("webgl", { antialias: true, depth: true, alpha: false });
      if (!gl || typeof gl.createShader !== "function") return null;
      const vertexSource = `
        attribute vec3 aPosition;
        attribute vec3 aNormal;
        attribute float aMaterial;
        uniform vec3 uCenter;
        uniform vec4 uRotation;
        uniform vec2 uViewport;
        uniform vec2 uPan;
        uniform float uScale;
        uniform float uRadius;
        varying vec3 vNormal;
        varying float vMaterial;
        void main() {
          vec3 p = aPosition - uCenter;
          float y1 = p.y * uRotation.x - p.z * uRotation.y;
          float z1 = p.y * uRotation.y + p.z * uRotation.x;
          float x2 = p.x * uRotation.z + z1 * uRotation.w;
          float z2 = -p.x * uRotation.w + z1 * uRotation.z;
          vec3 n = aNormal;
          float ny1 = n.y * uRotation.x - n.z * uRotation.y;
          float nz1 = n.y * uRotation.y + n.z * uRotation.x;
          vNormal = normalize(vec3(n.x * uRotation.z + nz1 * uRotation.w, ny1, -n.x * uRotation.w + nz1 * uRotation.z));
          vMaterial = aMaterial;
          vec2 clip = vec2(
            (x2 * uScale + uPan.x) / (uViewport.x * 0.5),
            (y1 * uScale + uPan.y) / (uViewport.y * 0.5)
          );
          gl_Position = vec4(clip, clamp(-z2 / (uRadius * 2.25), -0.98, 0.98), 1.0);
        }
      `;
      const fragmentSource = `
        precision mediump float;
        varying vec3 vNormal;
        varying float vMaterial;
        void main() {
          vec3 light = normalize(vec3(-0.22, -0.34, 0.86));
          float diffuse = max(dot(normalize(vNormal), light), 0.0);
          float shade = 0.36 + diffuse * 0.64;
          vec3 base = vec3(0.871, 0.812, 0.663);
          vec3 wire = vec3(0.063, 0.122, 0.125);
          vec3 color = mix(base, wire, vMaterial) * shade;
          gl_FragColor = vec4(color, 1.0);
        }
      `;
      try {
        const program = gl.createProgram();
        gl.attachShader(program, compileStlShader(gl, gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compileStlShader(gl, gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "WebGL program link failed");
        return {
          canvas,
          gl,
          program,
          mesh: null,
          buffers: {
            position: gl.createBuffer(),
            normal: gl.createBuffer(),
            material: gl.createBuffer()
          },
          attributes: {
            position: gl.getAttribLocation(program, "aPosition"),
            normal: gl.getAttribLocation(program, "aNormal"),
            material: gl.getAttribLocation(program, "aMaterial")
          },
          uniforms: {
            center: gl.getUniformLocation(program, "uCenter"),
            rotation: gl.getUniformLocation(program, "uRotation"),
            viewport: gl.getUniformLocation(program, "uViewport"),
            pan: gl.getUniformLocation(program, "uPan"),
            scale: gl.getUniformLocation(program, "uScale"),
            radius: gl.getUniformLocation(program, "uRadius")
          }
        };
      } catch (error) {
        return null;
      }
    }

    function uploadStlGlMesh(glState, mesh) {
      const { gl, buffers, attributes } = glState;
      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.position);
      gl.bufferData(gl.ARRAY_BUFFER, mesh.positions, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.normal);
      gl.bufferData(gl.ARRAY_BUFFER, mesh.normals, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.material);
      gl.bufferData(gl.ARRAY_BUFFER, mesh.vertexMaterial, gl.STATIC_DRAW);
      glState.mesh = mesh;
      gl.useProgram(glState.program);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.position);
      gl.enableVertexAttribArray(attributes.position);
      gl.vertexAttribPointer(attributes.position, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.normal);
      gl.enableVertexAttribArray(attributes.normal);
      gl.vertexAttribPointer(attributes.normal, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.material);
      gl.enableVertexAttribArray(attributes.material);
      gl.vertexAttribPointer(attributes.material, 1, gl.FLOAT, false, 0, 0);
    }

    function renderStlPreviewWebGl(mesh, canvas, rect, dpr) {
      if (!state.stlGl || state.stlGl.canvas !== canvas) state.stlGl = createStlGlState(canvas);
      const glState = state.stlGl;
      if (!glState) return false;
      const { gl, uniforms } = glState;
      if (glState.mesh !== mesh) uploadStlGlMesh(glState, mesh);
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const { rotX, rotY, zoom, panX, panY } = state.stlView;
      const scale = Math.min(width, height) * 0.82 / (mesh.radius * 2) * zoom;
      gl.viewport(0, 0, width, height);
      gl.clearColor(0.965, 0.949, 0.906, 1);
      gl.clearDepth(1);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.disable(gl.CULL_FACE);
      gl.disable(gl.BLEND);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(glState.program);
      gl.uniform3f(uniforms.center, mesh.center[0], mesh.center[1], mesh.center[2]);
      gl.uniform4f(uniforms.rotation, Math.cos(rotX), Math.sin(rotX), Math.cos(rotY), Math.sin(rotY));
      gl.uniform2f(uniforms.viewport, width, height);
      gl.uniform2f(uniforms.pan, panX * dpr, -panY * dpr);
      gl.uniform1f(uniforms.scale, scale);
      gl.uniform1f(uniforms.radius, mesh.radius);
      gl.drawArrays(gl.TRIANGLES, 0, mesh.triangleCount * 3);
      return true;
    }

    function renderStlPreviewCanvas() {
      const mesh = state.stlMesh;
      if (!mesh || controls.stlPane.hidden) return;
      const canvas = controls.stlCanvas;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      const gradient = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      gradient.addColorStop(0, "rgba(255,255,255,0.92)");
      gradient.addColorStop(1, "rgba(229,221,199,0.82)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, rect.width, rect.height);

      const { rotX, rotY, zoom, panX, panY } = state.stlView;
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const scale = Math.min(rect.width, rect.height) * 0.82 / (mesh.radius * 2) * zoom;
      const cx = rect.width / 2 + panX;
      const cy = rect.height / 2 + panY;
      const center = mesh.center;

      const transform = (x, y, z) => {
        x -= center[0];
        y -= center[1];
        z -= center[2];
        const y1 = y * cosX - z * sinX;
        const z1 = y * sinX + z * cosX;
        const x2 = x * cosY + z1 * sinY;
        const z2 = -x * sinY + z1 * cosY;
        return [cx + x2 * scale, cy - y1 * scale, z2, x2, y1];
      };

      const drawList = [];
      const p = mesh.positions;
      const baseRgb = [222, 207, 169];
      const wireRgb = [16, 31, 32];
      for (let t = 0; t < mesh.triangleCount; t += 1) {
        const i = t * 9;
        const a = transform(p[i], p[i + 1], p[i + 2]);
        const b = transform(p[i + 3], p[i + 4], p[i + 5]);
        const c = transform(p[i + 6], p[i + 7], p[i + 8]);
        const ux = b[3] - a[3], uy = b[4] - a[4], uz = b[2] - a[2];
        const vx = c[3] - a[3], vy = c[4] - a[4], vz = c[2] - a[2];
        const nx = uy * vz - uz * vy;
        const ny = uz * vx - ux * vz;
        const nz = ux * vy - uy * vx;
        if (!isPreviewFrontFace(a, b, c)) continue;
        const len = Math.hypot(nx, ny, nz) || 1;
        const light = clamp((nx / len) * -0.22 + (ny / len) * -0.34 + (nz / len) * 0.86, -1, 1);
        const shade = clamp(0.52 + light * 0.42, 0.28, 1);
        drawList.push({
          depth: (a[2] + b[2] + c[2]) / 3,
          points: [a, b, c],
          fill: shadeRgb(mesh.material[t] ? wireRgb : baseRgb, shade)
        });
      }

      drawList.sort((a, b) => a.depth - b.depth);
      ctx.lineJoin = "round";
      for (const tri of drawList) {
        const [a, b, c] = tri.points;
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.lineTo(c[0], c[1]);
        ctx.closePath();
        ctx.fillStyle = tri.fill;
        ctx.fill();
      }
    }

    function renderStlPreview() {
      const mesh = state.stlMesh;
      if (!mesh || controls.stlPane.hidden) return;
      const canvas = controls.stlCanvas;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      if (renderStlPreviewWebGl(mesh, canvas, rect, dpr)) return;
      renderStlPreviewCanvas();
    }

          if (candidateArea <= Math.abs(ring.area) || candidateArea >= parentArea) continue;

          if (probe[0] < box.minX || probe[0] > box.maxX || probe[1] < box.minY || probe[1] > box.maxY) continue;

    function combineVectorMeshes(meshes) {

        let area = 0;
        for (let index = 0, previous = points.length - 1; index < points.length; previous = index, index += 1) {

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const point of points) {
          minX = Math.min(minX, point[0]);
          minY = Math.min(minY, point[1]);
          maxX = Math.max(maxX, point[0]);
          maxY = Math.max(maxY, point[1]);

        let inside = false;
        for (let index = 0, previous = points.length - 1; index < points.length; previous = index, index += 1) {

          const b = points[previous];
          if ((a[1] > point[1]) !== (b[1] > point[1])
            && point[0] < (b[0] - a[0]) * (point[1] - a[1]) / (b[1] - a[1]) + a[0]) {

          }
        }

      };
      const ringKey = (points) => {
        const values = points.map((point) => `${Math.round(point[0] * 1000000)},${Math.round(point[1] * 1000000)}`);
        let anchor = 0;
        for (let index = 1; index < values.length; index += 1) {
          if (values[index] < values[anchor]) anchor = index;
        }
        const sequence = (direction) => {
          const output = [];
          for (let index = 0; index < values.length; index += 1) {
            output.push(values[(anchor + direction * index + values.length) % values.length]);
          }
          return output.join(";");
        };
        const forward = sequence(1);
        const reverse = sequence(-1);
        return forward < reverse ? forward : reverse;
      };

      const sourceRings = meshes
        .filter(Boolean)
        .flatMap((mesh) => mesh.rings.map((ring) => ring.points.map((point) => [point[0], point[1]])));
      for (const points of sourceRings) {
        const key = ringKey(points);
        if (uniqueRings.has(key)) uniqueRings.delete(key);
        else uniqueRings.set(key, points);
      }
      const rings = Array.from(uniqueRings.values())
        .map((points) => ({ points, area: signedArea(points), bounds: boundsOf(points), parent: -1, depth: 0 }));
      if (!rings.length) return null;
      for (let index = 0; index < rings.length; index += 1) {
        const ring = rings[index];
        const probe = ring.points[0];
        let parentArea = Infinity;
        for (let candidateIndex = 0; candidateIndex < rings.length; candidateIndex += 1) {
          if (candidateIndex === index) continue;
          const candidate = rings[candidateIndex];
          const candidateArea = Math.abs(candidate.area);
          if (candidateArea <= Math.abs(ring.area) || candidateArea >= parentArea) continue;
          const box = candidate.bounds;
          if (probe[0] < box.minX || probe[0] > box.maxX || probe[1] < box.minY || probe[1] > box.maxY) continue;
          if (!containsPoint(candidate.points, probe)) continue;

      for (const ring of rings) {

          if (ring.depth > rings.length) throw new Error("组合轮廓层级异常");
        }

        if ((ring.area < 0) !== shouldBeNegative) {

        }

      let surfaceTriangleCount = 0;
      for (let index = 0; index < rings.length; index += 1) {
        const outer = rings[index];
        if (outer.depth % 2 !== 0) continue;
        const holes = rings.filter((ring) => ring.parent === index && ring.depth === outer.depth + 1);
        const coordinates = [];
        const holeIndices = [];
        const append = (ring, isHole) => {

        groups,

    function buildVectorWatermarkMask(mask, width, height, modelWidth, modelHeight, source) {
      if (!source?.data) return null;

      for (let y = 0; y < height; y += 1) {

        if (v < 0 || v >= 1) continue;
        const iy = Math.min(source.rasterHeight - 1, Math.max(0, Math.floor((1 - v) * source.rasterHeight)));
        for (let x = 0; x < width; x += 1) {

          const xMm = -modelWidth / 2 + (x + 0.5) * modelWidth / width;
          const u = (xMm - source.x0) / source.widthMm;

      for (let y = 0; y < height; y += 1) {

          if (!innerMask[index]) continue;
          if (x === 0 || y === 0 || x === width - 1 || y === height - 1) return true;

    function runPixelGridStlJobLegacy(job) {
      const width = job.width;
      const height = job.height;
      const modelWidth = job.modelWidth;
      const modelHeight = job.modelHeight;
      const baseHeight = job.baseEnabled ? job.baseThickness : 0;
      const wireHeight = job.wireHeight;
      const contourSmooth = Math.max(0, Math.round(job.contourSmooth || 0));

          height: textOnlyWatermark.rasterHeight,
          modelWidth: textOnlyWatermark.widthMm,
          modelHeight: textOnlyWatermark.heightMm,
          baseEnabled: true,
          baseThickness: textOnlyWatermark.depth || 3,
          wireHeight: 0,
          contourSmooth: 1,
          wireMask: new Uint8Array(rasterSize),
          baseMask: textOnlyWatermark.data,
          baseRimMask: new Uint8Array(rasterSize),
          baseWatermark: null,
          standaloneWatermarks: null,
          standaloneWatermark: null,
          watermark: null,
          textOnlyWatermark: null,

        });
      }
      const wireMask = job.wireMask instanceof Uint8Array ? job.wireMask : new Uint8Array(job.wireMask);
      const baseMask = job.baseMask instanceof Uint8Array ? job.baseMask : new Uint8Array(job.baseMask);
      const baseRimMask = job.baseRimMask
        ? (job.baseRimMask instanceof Uint8Array ? job.baseRimMask : new Uint8Array(job.baseRimMask))
        : new Uint8Array(width * height);
      const legacyWatermark = normalizeWatermark(job.watermark);
      const baseWatermark = normalizeWatermark(job.baseWatermark)
        || (legacyWatermark?.kind === "base" ? legacyWatermark : null);
      const standaloneSources = Array.isArray(job.standaloneWatermarks) && job.standaloneWatermarks.length
        ? job.standaloneWatermarks
        : job.standaloneWatermark
          ? [job.standaloneWatermark]
          : legacyWatermark?.kind === "standalone"
            ? [legacyWatermark]
            : [];
      const standaloneWatermarks = job.skipStandaloneWatermark
        ? []
        : standaloneSources.map(normalizeWatermark).filter(Boolean);
      const watermarkActive = Boolean(baseWatermark || standaloneWatermarks.length);
      const solids = [];
      if (job.baseEnabled && baseHeight > 0) solids.push({ mask: baseMask, z0: 0, z1: baseHeight, watermark: baseWatermark });
      if (wireHeight > 0) {

        solids.push({ mask: wireMask, z0: baseHeight, z1: baseHeight + wireHeight });

      const px = (x) => -modelWidth / 2 + x * modelWidth / width;
      const py = (y) => modelHeight / 2 - y * modelHeight / height;

      function watermarkHit(p, source) {

        const u = (xMm - source.x0) / source.widthMm;
        const v = (yMm - source.y0) / source.heightMm;
        if (u < 0 || u >= 1 || v < 0 || v >= 1) return false;
        const sourceU = source.mirrorX ? 1 - u : u;
        const ix = Math.min(source.rasterWidth - 1, Math.max(0, Math.floor(sourceU * source.rasterWidth)));
        const iy = Math.min(source.rasterHeight - 1, Math.max(0, Math.floor((1 - v) * source.rasterHeight)));

        const yScale = height / modelHeight;
        const paddingX = source.paddingMm * xScale;
        const paddingY = source.paddingMm * yScale;
        const rawX0 = (source.x0 + modelWidth / 2) * xScale - paddingX;
        const rawX1 = (source.x0 + source.widthMm + modelWidth / 2) * xScale + paddingX;
        const rawY0 = (modelHeight / 2 - (source.y0 + source.heightMm)) * yScale - paddingY;
        const rawY1 = (modelHeight / 2 - source.y0) * yScale + paddingY;
        const targetCellMm = 0.08;
        const step = Math.max(1, Math.round(targetCellMm / Math.max(1e-6, Math.min(modelWidth / width, modelHeight / height))));
        const x0 = Math.max(0, Math.floor(rawX0 / step) * step);
        const x1 = Math.min(width, Math.ceil(rawX1 / step) * step);
        const y0 = Math.max(0, Math.floor(rawY0 / step) * step);
        const y1 = Math.min(height, Math.ceil(rawY1 / step) * step);

      function makeScalarGrid(mask) {

        let grid = new Float32Array(gw * gh);
        for (let y = 0; y <= height; y += 1) {
          for (let x = 0; x <= width; x += 1) {
            let sum = 0;
            if (x > 0 && y > 0) sum += mask[(y - 1) * width + x - 1];
            if (x < width && y > 0) sum += mask[(y - 1) * width + x];
            if (x > 0 && y < height) sum += mask[y * width + x - 1];
            if (x < width && y < height) sum += mask[y * width + x];
            grid[y * gw + x] = sum * 0.25;
          }
        }
        for (let iter = 0; iter < contourSmooth; iter += 1) {
          const next = new Float32Array(grid.length);
          for (let y = 0; y < gh; y += 1) {
            for (let x = 0; x < gw; x += 1) {

              for (let oy = -1; oy <= 1; oy += 1) {

                if (yy < 0 || yy >= gh) continue;
                for (let ox = -1; ox <= 1; ox += 1) {
                  const xx = x + ox;
                  if ((ox === 0 && oy === 0) || xx < 0 || xx >= gw) continue;
                  const w = ox === 0 || oy === 0 ? 2 : 1;
                  sum += grid[yy * gw + xx] * w;
                  weight += w;
                }
              }
              next[y * gw + x] = sum / weight;

      const preparedSolids = solids.map((solid) => ({
        ...solid,
        ...makeScalarGrid(solid.mask),
        watermarkPatch: makeWatermarkPatch(solid.watermark)

      function cellCode(solid, x, y) {
        const i = y * solid.gw + x;
        return (solid.grid[i] >= 0.5 ? 1 : 0)
          | (solid.grid[i + 1] >= 0.5 ? 2 : 0)
          | (solid.grid[i + solid.gw + 1] >= 0.5 ? 4 : 0)
          | (solid.grid[i + solid.gw] >= 0.5 ? 8 : 0);

      function cellValues(solid, x, y) {
        const i = y * solid.gw + x;

          solid.grid[i + 1],
          solid.grid[i + solid.gw + 1],
          solid.grid[i + solid.gw]

        return (values[0] >= 0.5 ? 1 : 0)

          | (values[2] >= 0.5 ? 4 : 0)
          | (values[3] >= 0.5 ? 8 : 0);

          7: [[e30, e23]],
          8: [[e23, e30]],

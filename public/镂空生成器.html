      const pxToMmX = modelWidth / width;
      const pxToMmY = modelHeight / height;
      const baseWidth = Math.max(pxToMmX, (maxX - minX + 1) * pxToMmX);
      const baseHeight = Math.max(pxToMmY, (maxY - minY + 1) * pxToMmY);
      const watermarkWidth = Math.min(baseWidth * 0.64, baseHeight * 2.8);
      const watermarkHeight = Math.min(baseHeight * 0.22, watermarkWidth / 3.5);
      if (watermarkWidth <= 0.6 || watermarkHeight <= 0.4) return null;

      const rasterWidth = Math.max(480, Math.min(1800, Math.round(watermarkWidth * 42)));
      const rasterHeight = Math.max(180, Math.min(720, Math.round(watermarkHeight * 42)));
      const canvas = document.createElement("canvas");
      canvas.width = rasterWidth;
      canvas.height = rasterHeight;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.clearRect(0, 0, rasterWidth, rasterHeight);
      context.fillStyle = "#000";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.font = '100px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
      const widestLine = Math.max(...MODEL_WATERMARK_LINES.map((line) => context.measureText(line).width));
      const fontSize = Math.max(10, Math.floor(Math.min((rasterWidth * 0.9 * 100) / widestLine, rasterHeight / 3.65)));
      context.font = `${fontSize}px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif`;
      const lineStep = rasterHeight / (MODEL_WATERMARK_LINES.length + 1);
      MODEL_WATERMARK_LINES.forEach((line, index) => {
        context.fillText(line, rasterWidth / 2, lineStep * (index + 1));
      });
      const rgba = context.getImageData(0, 0, rasterWidth, rasterHeight).data;
      const data = new Uint8Array(rasterWidth * rasterHeight);
      for (let index = 0; index < data.length; index += 1) {
        data[index] = rgba[index * 4 + 3] > 64 ? 1 : 0;
      }

      const centerX = -modelWidth / 2 + ((minX + maxX + 1) * 0.5) * pxToMmX;
      const centerY = modelHeight / 2 - ((minY + maxY + 1) * 0.5) * pxToMmY;
      return {
        data,
        rasterWidth,
        rasterHeight,
        x0: centerX - watermarkWidth / 2,
        y0: centerY - watermarkHeight / 2,
        widthMm: watermarkWidth,
        heightMm: watermarkHeight,
        paddingMm: Math.max(0.45, Math.min(1.2, Math.min(watermarkWidth, watermarkHeight) * 0.16)),
        depth: MODEL_WATERMARK_DEPTH,
        surface: "bottom",
        // The underside is viewed from the opposite direction, so flip X before carving.
        mirrorX: true
      };
    }

    function buildStandaloneWatermarks(processed) {
      if (!processed?.wireMask?.length || !processed.modelWidth || !processed.modelHeight) return [];
      const { wireMask, width, height, modelWidth, modelHeight } = processed;
      let minX = width;
      let minY = height;
      let maxX = -1;
      let maxY = -1;
      for (let y = 0; y < height; y += 1) {
        const row = y * width;
        for (let x = 0; x < width; x += 1) {
          if (!wireMask[row + x]) continue;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
      }
      if (maxX < minX || maxY < minY) return [];

      const pxToMmX = modelWidth / width;
      const pxToMmY = modelHeight / height;
      const minMmX = -modelWidth / 2 + minX * pxToMmX;
      const maxMmX = -modelWidth / 2 + (maxX + 1) * pxToMmX;
      const maxMmY = modelHeight / 2 - minY * pxToMmY;
      const minMmY = modelHeight / 2 - (maxY + 1) * pxToMmY;
      const artworkWidth = Math.max(pxToMmX, maxMmX - minMmX);
      const artworkHeight = Math.max(pxToMmY, maxMmY - minMmY);
      const gap = Math.max(0.7, Math.min(2.4, Math.min(artworkWidth, artworkHeight) * 0.035));
      const textHeight = Math.max(1.2, Math.min(2.7, Math.min(artworkWidth, artworkHeight) * 0.075));
      const horizontalWidth = Math.max(7, Math.min(artworkWidth * 0.92, 58));
      const verticalWidth = Math.max(7, Math.min(artworkHeight * 0.72, 52));
      const makeLabel = (text, widthMm, rotation, centerX, centerY) => {
        const raster = makeWatermarkRaster(text, widthMm, textHeight);
        return {
          ...raster,
          x0: centerX - widthMm / 2,
          y0: centerY - textHeight / 2,
          widthMm,
          heightMm: textHeight,
          depth: MODEL_WATERMARK_DEPTH,
          rotation
        };
      };
      return [
        makeLabel(MODEL_WATERMARK_LINES[0], horizontalWidth, 0, (minMmX + maxMmX) / 2, maxMmY + gap + textHeight / 2),
        makeLabel(MODEL_WATERMARK_LINES[1], verticalWidth, -90, maxMmX + gap + textHeight / 2, (minMmY + maxMmY) / 2),
        makeLabel(MODEL_WATERMARK_LINES[2], horizontalWidth, 180, (minMmX + maxMmX) / 2, minMmY - gap - textHeight / 2),
        makeLabel("镂空生成器", verticalWidth, 90, minMmX - gap - textHeight / 2, (minMmY + maxMmY) / 2)
      ];
    }

    function cropMaskToContent(mask, width, height, padding = 2) {
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          if (!mask[y * width + x]) continue;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
      }
      if (maxX < minX) return { mask, width, height, x: 0, y: 0 };
      minX = Math.max(0, minX - padding);
      minY = Math.max(0, minY - padding);
      maxX = Math.min(width - 1, maxX + padding);
      maxY = Math.min(height - 1, maxY + padding);
      const croppedWidth = maxX - minX + 1;
      const croppedHeight = maxY - minY + 1;
      const cropped = new Uint8Array(croppedWidth * croppedHeight);
      for (let y = 0; y < croppedHeight; y += 1) {
        for (let x = 0; x < croppedWidth; x += 1) {
          cropped[y * croppedWidth + x] = mask[(minY + y) * width + minX + x];
        }
      }
      return { mask: cropped, width: croppedWidth, height: croppedHeight, x: minX, y: minY };
    }

    function buildWatermarkTextModel(processed) {
      const longestSide = Math.max(processed?.modelWidth || 80, processed?.modelHeight || 50);
      const textWidthMm = Math.max(45, Math.min(120, longestSide * 0.86));
      const textHeightMm = Math.max(18, textWidthMm * 0.36);
      const pxPerMm = 18;
      const rasterWidth = Math.max(720, Math.round(textWidthMm * pxPerMm));
      const rasterHeight = Math.max(240, Math.round(textHeightMm * pxPerMm));
      const canvas = document.createElement("canvas");
      canvas.width = rasterWidth;
      canvas.height = rasterHeight;
      const context = canvas.getContext("2d");
      context.clearRect(0, 0, rasterWidth, rasterHeight);
      context.fillStyle = "#000";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.font = '100px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
      const widestLine = Math.max(...MODEL_WATERMARK_LINES.map((line) => context.measureText(line).width));
      const fontSize = Math.max(18, Math.floor(Math.min((rasterWidth * 0.92 * 100) / widestLine, rasterHeight / 4.2)));
      context.font = `${fontSize}px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif`;
      const lineStep = rasterHeight / (MODEL_WATERMARK_LINES.length + 1);
      MODEL_WATERMARK_LINES.forEach((line, index) => {
        context.fillText(line, rasterWidth / 2, lineStep * (index + 1));
      });
      const rgba = context.getImageData(0, 0, rasterWidth, rasterHeight).data;
      const mask = new Uint8Array(rasterWidth * rasterHeight);
      for (let i = 0, p = 0; i < rgba.length; i += 4, p += 1) {
        mask[p] = rgba[i + 3] > 30 ? 1 : 0;
      }
      const cropped = cropMaskToContent(mask, rasterWidth, rasterHeight, Math.round(pxPerMm * 0.3));
      return {
        kind: "textOnly",
        data: cropped.mask,
        rasterWidth: cropped.width,
        rasterHeight: cropped.height,
        widthMm: cropped.width / pxPerMm,
        heightMm: cropped.height / pxPerMm,
        depth: WATERMARK_TEXT_MODEL_DEPTH
      };
    }

    function resampleMaskForMesh(maskSource, sourceWidth, sourceHeight, targetWidth, targetHeight, coverageThreshold) {
      const source = maskSource instanceof Uint8Array ? maskSource : new Uint8Array(maskSource);
      if (sourceWidth === targetWidth && sourceHeight === targetHeight) return source;
      const output = new Uint8Array(targetWidth * targetHeight);
      for (let targetY = 0; targetY < targetHeight; targetY += 1) {
        const sourceY0 = Math.floor(targetY * sourceHeight / targetHeight);
        const sourceY1 = Math.max(sourceY0 + 1, Math.ceil((targetY + 1) * sourceHeight / targetHeight));
        for (let targetX = 0; targetX < targetWidth; targetX += 1) {
          const sourceX0 = Math.floor(targetX * sourceWidth / targetWidth);
          const sourceX1 = Math.max(sourceX0 + 1, Math.ceil((targetX + 1) * sourceWidth / targetWidth));
          let filled = 0;
          const area = (sourceX1 - sourceX0) * (sourceY1 - sourceY0);
          for (let sourceY = sourceY0; sourceY < sourceY1; sourceY += 1) {
            const row = sourceY * sourceWidth;
            for (let sourceX = sourceX0; sourceX < sourceX1; sourceX += 1) {
              filled += source[row + sourceX];
            }
          }
          output[targetY * targetWidth + targetX] = filled / area >= coverageThreshold ? 1 : 0;
        }
      }
      return output;
    }

    function meshTargetSize(job) {
      const sourceWidth = job.width;
      const sourceHeight = job.height;
      const currentPixelsPerMm = Math.max(sourceWidth / job.modelWidth, sourceHeight / job.modelHeight);
      const requestedPixelsPerMm = Math.min(currentPixelsPerMm, job.maxMeshPixelsPerMm || 12);
      let targetWidth = Math.min(sourceWidth, Math.max(2, Math.round(job.modelWidth * requestedPixelsPerMm)));
      let targetHeight = Math.min(sourceHeight, Math.max(2, Math.round(job.modelHeight * requestedPixelsPerMm)));
      const longestLimit = job.maxMeshLongestSide || 2800;
      const pixelLimit = job.maxMeshPixels || 6000000;
      const limitScale = Math.min(
        1,
        longestLimit / Math.max(targetWidth, targetHeight),
        Math.sqrt(pixelLimit / (targetWidth * targetHeight))
      );
      targetWidth = Math.max(2, Math.round(targetWidth * limitScale));
      targetHeight = Math.max(2, Math.round(targetHeight * limitScale));
      return {
        width: targetWidth,
        height: targetHeight,
        limited: targetWidth < sourceWidth || targetHeight < sourceHeight
      };
    }

    function prepareMeshJob(job) {
      const sourceWidth = job.width;
      const sourceHeight = job.height;
      const target = meshTargetSize(job);
      const wireMask = resampleMaskForMesh(job.wireMask, sourceWidth, sourceHeight, target.width, target.height, 0.18);
      const baseMask = resampleMaskForMesh(job.baseMask, sourceWidth, sourceHeight, target.width, target.height, 0.5);
      const baseRimMask = resampleMaskForMesh(job.baseRimMask, sourceWidth, sourceHeight, target.width, target.height, 0.18);
      if (job.baseEnabled && job.wireHeight > 0) {
        for (let index = 0; index < baseMask.length; index += 1) {
          if (wireMask[index] || baseRimMask[index]) baseMask[index] = 1;
        }
      }
      return {
        ...job,
        width: target.width,
        height: target.height,
        wireMask,
        baseMask,
        baseRimMask,
        sourceGridWidth: sourceWidth,
        sourceGridHeight: sourceHeight,
        meshLimited: target.limited
      };
    }

    function runMeshJob(kind, job) {
      const prepared = prepareMeshJob(job);
      const result = kind === "3mf" ? run3mfJob(prepared) : runStlJob(prepared);
      return {
        ...result,
        sourceGridWidth: prepared.sourceGridWidth,
        sourceGridHeight: prepared.sourceGridHeight,
        meshWidth: prepared.width,
        meshHeight: prepared.height,
        meshLimited: prepared.meshLimited
      };
    }

    function stlPayload(includeMasks = true) {
      const p = state.processed;
      const matchedWatermarkSettings = watermarkSettingsMatch();
      return {
        width: p.width,
        height: p.height,
        modelWidth: p.modelWidth,
        modelHeight: p.modelHeight,
        baseEnabled: true,
        baseThickness: Number(controls.wireHeight.value),
        wireHeight: 0,
        contourSmooth: Number(controls.contourSmooth.value),
        wireMask: includeMasks ? p.wireMask.slice().buffer : null,
        baseMask: includeMasks ? p.baseMask.slice().buffer : null,
        baseRimMask: includeMasks ? p.baseRimMask.slice().buffer : null,
        maxMeshPixelsPerMm: MAX_MESH_PIXELS_PER_MM,
        maxMeshLongestSide: MAX_MESH_LONGEST_SIDE,
        maxMeshPixels: MAX_MESH_PIXELS,
        maxPreviewTriangles: MAX_PREVIEW_TRIANGLES,
        baseWatermark: matchedWatermarkSettings ? buildBaseWatermark(p) : null,
        standaloneWatermarks: [],
        textOnlyWatermark: null
      };
    }

    function binaryStlTo3mfMesh(buffer) {
      const view = new DataView(buffer);
      const triangleCount = view.getUint32(80, true);
      const vertices = [];
      const triangles = [];
      const vertexIndex = new Map();
      const addVertex = (x, y, z) => {
        const key = `${x},${y},${z}`;
        const existing = vertexIndex.get(key);
        if (existing !== undefined) return existing;
        const index = vertices.length;
        vertexIndex.set(key, index);
        vertices.push([x, y, z]);
        return index;
      };
      for (let t = 0; t < triangleCount; t += 1) {
        const offset = 84 + t * 50 + 12;
        const triangle = [];
        for (let v = 0; v < 3; v += 1) {
          triangle.push(addVertex(
            view.getFloat32(offset + v * 12, true),
            view.getFloat32(offset + v * 12 + 4, true),
            view.getFloat32(offset + v * 12 + 8, true)
          ));
        }
        triangles.push(triangle);
      }
      return { vertices, triangles };
    }

    function mergeBinaryStlParts(parts) {
      let triangleCount = 0;
      for (const part of parts) triangleCount += new DataView(part.buffer).getUint32(80, true);
      const output = new ArrayBuffer(84 + triangleCount * 50);
      const out = new DataView(output);
      const title = "hollow 3mf preview stl";
      for (let i = 0; i < title.length && i < 80; i += 1) out.setUint8(i, title.charCodeAt(i));
      out.setUint32(80, triangleCount, true);
      let writeOffset = 84;
      for (const part of parts) {
        const input = new DataView(part.buffer);
        const count = input.getUint32(80, true);
        const zOffset = part.zOffset || 0;
        for (let t = 0; t < count; t += 1) {
          const readOffset = 84 + t * 50;
          out.setFloat32(writeOffset, input.getFloat32(readOffset, true), true);
          out.setFloat32(writeOffset + 4, input.getFloat32(readOffset + 4, true), true);
          out.setFloat32(writeOffset + 8, input.getFloat32(readOffset + 8, true), true);
          for (let v = 0; v < 3; v += 1) {
            const sourceVertex = readOffset + 12 + v * 12;
            const targetVertex = writeOffset + 12 + v * 12;
            out.setFloat32(targetVertex, input.getFloat32(sourceVertex, true), true);
            out.setFloat32(targetVertex + 4, input.getFloat32(sourceVertex + 4, true), true);
            out.setFloat32(targetVertex + 8, input.getFloat32(sourceVertex + 8, true) + zOffset, true);
          }
          out.setUint16(writeOffset + 48, input.getUint16(readOffset + 48, true), true);
          writeOffset += 50;
        }
      }
      return output;
    }

    function threeMfNumber(value) {
      return Number(value.toFixed(6)).toString();
    }

    function threeMfMeshXml(mesh, id, name, materialIndex) {
      const vertices = mesh.vertices.map((vertex) => `<vertex x="${threeMfNumber(vertex[0])}" y="${threeMfNumber(vertex[1])}" z="${threeMfNumber(vertex[2])}"/>`).join("");
      const triangles = mesh.triangles.map((triangle) => `<triangle v1="${triangle[0]}" v2="${triangle[1]}" v3="${triangle[2]}"/>`).join("");
      return `<object id="${id}" type="model" name="${name}" pid="1" pindex="${materialIndex}"><mesh><vertices>${vertices}</vertices><triangles>${triangles}</triangles></mesh></object>`;
    }

    function crc32(bytes) {
      let crc = -1;
      for (let i = 0; i < bytes.length; i += 1) {
        crc ^= bytes[i];
        for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0);
      }
      return (crc ^ -1) >>> 0;
    }

    function writeZipStore(entries) {
      const encoder = new TextEncoder();
      const prepared = entries.map((entry) => ({
        name: encoder.encode(entry.name),
        data: entry.data instanceof Uint8Array ? entry.data : encoder.encode(entry.data)
      }));
      let offset = 0;
      const localParts = [];
      for (const entry of prepared) {
        entry.crc = crc32(entry.data);
        entry.offset = offset;
        const header = new Uint8Array(30 + entry.name.length);
        const view = new DataView(header.buffer);
        view.setUint32(0, 0x04034B50, true);
        view.setUint16(4, 20, true);
        view.setUint16(8, 0, true);
        view.setUint32(14, entry.crc, true);
        view.setUint32(18, entry.data.length, true);
        view.setUint32(22, entry.data.length, true);
        view.setUint16(26, entry.name.length, true);
        header.set(entry.name, 30);
        localParts.push(header, entry.data);
        offset += header.length + entry.data.length;
      }
      const centralOffset = offset;
      const centralParts = [];
      for (const entry of prepared) {
        const header = new Uint8Array(46 + entry.name.length);
        const view = new DataView(header.buffer);
        view.setUint32(0, 0x02014B50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 20, true);
        view.setUint16(10, 0, true);
        view.setUint32(16, entry.crc, true);
        view.setUint32(20, entry.data.length, true);
        view.setUint32(24, entry.data.length, true);
        view.setUint16(28, entry.name.length, true);
        view.setUint32(42, entry.offset, true);
        header.set(entry.name, 46);
        centralParts.push(header);
        offset += header.length;
      }
      const centralSize = offset - centralOffset;
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054B50, true);
      endView.setUint16(8, prepared.length, true);
      endView.setUint16(10, prepared.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, centralOffset, true);
      const output = new Uint8Array(offset + end.length);
      let writeOffset = 0;
      for (const part of [...localParts, ...centralParts, end]) {
        output.set(part, writeOffset);
        writeOffset += part.length;
      }
      return output.buffer;
    }

    function run3mfJob(job) {
      const solidResult = runStlJob({
        ...job,
        wireHeight: 0,
        standaloneWatermarks: null,
        standaloneWatermark: null,
        skipStandaloneWatermark: true
      });
      if (!solidResult.ok) return solidResult;
      const objectSpec = { id: 2, name: "镂空实体", materialIndex: 0, extruder: 1, mesh: binaryStlTo3mfMesh(solidResult.buffer) };
      const objectXml = threeMfMeshXml(objectSpec.mesh, objectSpec.id, objectSpec.name, objectSpec.materialIndex);
      const watermarkDepth = job.baseWatermark?.depth || 0;
      const watermarkNote = job.baseWatermark
        ? `镂空实体背面含 ${threeMfNumber(watermarkDepth)}mm 浅凹水印`
        : "未嵌入模型水印";
      const attribution = job.baseWatermark
        ? `<metadata name="Copyright">该模型由镂空生成器制作，作者：钟福贵，抖音号：ad201655</metadata><metadata name="Watermark">${watermarkNote}</metadata>`
        : "";
      const modelXml = `<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="zh-CN" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><metadata name="Title">镂空模型</metadata><metadata name="Application">镂空生成器</metadata>${attribution}<resources><basematerials id="1"><base name="镂空实体" displaycolor="#FFFFFFFF"/></basematerials>${objectXml}</resources><build><item objectid="2"/></build></model>`;
      const modelSettings = `<?xml version="1.0" encoding="UTF-8"?><config><object id="2"><metadata type="object" key="name" value="镂空实体"/><metadata type="object" key="extruder" value="1"/></object></config>`;
      const projectSettings = `<?xml version="1.0" encoding="UTF-8"?><config><filament_colour values="#FFFFFFFF"/><filament_settings_id values="White PLA"/><filament_type values="PLA"/><filament_diameter values="1.75"/></config>`;
      const contentTypes = `<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/><Default Extension="config" ContentType="text/xml"/></Types>`;
      const relationships = `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`;
      const buffer = writeZipStore([
        { name: "[Content_Types].xml", data: contentTypes },
        { name: "_rels/.rels", data: relationships },
        { name: "3D/3dmodel.model", data: modelXml },
        { name: "Metadata/model_settings.config", data: modelSettings },
        { name: "Metadata/project_settings.config", data: projectSettings }
      ]);
      return {
        ok: true,
        buffer,
        previewBuffer: solidResult.buffer,
        byteLength: buffer.byteLength,
        objectCount: 1,
        materialCount: 1,
        previewTriangleCount: solidResult.triangleCount,
        modelingMode: solidResult.modelingMode,
        vectorPointCount: solidResult.vectorPointCount || 0,
        vectorRingCount: solidResult.vectorRingCount || 0,
        vectorError: solidResult.vectorError
      };
    }

    function workerSource() {
      return `
        const clamp = ${clamp.toString()};

        let cachedMasks = null;
        self.onmessage = (event) => {
          const requestId = event.data.requestId;
          try {
            const message = event.data;
            const kind = message.kind;
            const payload = message.payload;
            if (kind === "process") {
              const result = runProcessJob(payload);
              const processed = result.processed;
              cachedMasks = {
                revision: result.maskRevision,
                width: processed.width,
                height: processed.height,
                wireMask: processed.wireMask.slice(),
                baseMask: processed.baseMask.slice(),
                baseRimMask: processed.baseRimMask.slice()
              };
              const response = {
                ...result,
                requestId,
                processed: {
                  ...processed,
                  imageData: processed.imageData.buffer,
                  sourceLineMask: processed.sourceLineMask.buffer,
                  lineMask: processed.lineMask.buffer,
                  alphaMask: processed.alphaMask.buffer,
                  wireMask: processed.wireMask.buffer,
                  baseMask: processed.baseMask.buffer,
                  baseRimMask: processed.baseRimMask.buffer,
                  componentMask: processed.componentMask.buffer
                }
              };
              self.postMessage(response, [
                response.processed.imageData,
                response.processed.sourceLineMask,
                response.processed.lineMask,
                response.processed.alphaMask,
                response.processed.wireMask,
                response.processed.baseMask,
                response.processed.baseRimMask,
                response.processed.componentMask
              ]);
              return;
            }
            if (payload.masks) {
              cachedMasks = {
                revision: payload.maskRevision,
                width: payload.job.width,
                height: payload.job.height,
                wireMask: new Uint8Array(payload.masks.wireMask),
                baseMask: new Uint8Array(payload.masks.baseMask),
                baseRimMask: new Uint8Array(payload.masks.baseRimMask)
              };
            }
            if (!cachedMasks || cachedMasks.revision !== payload.maskRevision) {
              throw new Error("Worker 掩码缓存已失效，请重新生成");
            }
            const job = {
              ...payload.job,
              width: cachedMasks.width,
              height: cachedMasks.height,
              wireMask: cachedMasks.wireMask,
              baseMask: cachedMasks.baseMask,
              baseRimMask: cachedMasks.baseRimMask
            };
            const result = runMeshJob(kind, job);
            if (kind === "3mf" && result.previewTriangleCount > (job.maxPreviewTriangles || 500000)) {
              result.previewBuffer = null;
            }
            if (!result.ok) {
              self.postMessage({ ...result, requestId });
              return;
            }
            const transfers = [result.buffer];
            if (result.previewBuffer) transfers.push(result.previewBuffer);
            self.postMessage({ ...result, requestId }, transfers);
          } catch (error) {
            self.postMessage({ requestId, ok: false, error: error?.message || String(error) });
          }
        };
      `;
    }

    function createWorker() {
      const blob = new Blob([workerSource()], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      const worker = new Worker(url);
      state.workerUrl = url;
      return worker;
    }

    function ensureWorker() {
      if (state.worker) return state.worker;
      const worker = createWorker();
      state.worker = worker;
      state.workerMaskRevision = -1;
      worker.onmessage = (event) => {
        const request = state.workerRequests.get(event.data.requestId);
        if (!request) return;
        state.workerRequests.delete(event.data.requestId);
        state.workerBusy = state.workerRequests.size > 0;
        request.resolve(event.data);
      };
      worker.onerror = (event) => {
        const error = new Error(event.message || "后台任务失败");
        stopWorker();
        console.warn(error);
      };
      return worker;
    }

    function runWorkerTask(kind, payload, transfers = []) {
      const worker = ensureWorker();
      const requestId = state.workerRequestId + 1;
      state.workerRequestId = requestId;
      state.workerBusy = true;
      return new Promise((resolve, reject) => {
        state.workerRequests.set(requestId, { resolve, reject });
        try {
          worker.postMessage({ requestId, kind, payload }, transfers);
        } catch (error) {
          state.workerRequests.delete(requestId);
          state.workerBusy = state.workerRequests.size > 0;
          reject(error);
        }
      });
    }

    function workerGenerationTask(kind, job) {
      const transfers = [];
      let masks = null;
      if (state.workerMaskRevision !== state.maskRevision) {
        masks = {
          wireMask: state.processed.wireMask.slice().buffer,
          baseMask: state.processed.baseMask.slice().buffer,
          baseRimMask: state.processed.baseRimMask.slice().buffer
        };
        transfers.push(masks.wireMask, masks.baseMask, masks.baseRimMask);
      }
      if (job.baseWatermark?.data?.buffer) transfers.push(job.baseWatermark.data.buffer);
      if (job.textOnlyWatermark?.data?.buffer) transfers.push(job.textOnlyWatermark.data.buffer);
      for (const watermark of job.standaloneWatermarks || (job.standaloneWatermark ? [job.standaloneWatermark] : [])) {
        if (watermark?.data?.buffer) transfers.push(watermark.data.buffer);
      }
      return runWorkerTask(kind, { job, maskRevision: state.maskRevision, masks }, transfers)
        .then((result) => {
          if (result.ok) state.workerMaskRevision = state.maskRevision;
          return result;
        });
    }

    function safeExportBaseName(extension) {

    function svgNumber(value) {
      return Number(value.toFixed(4)).toString();
    }

    function buildSvgScalarGrid(mask, width, height, smoothIterations) {
      const gw = width + 1;
      const gh = height + 1;
      let grid = new Float32Array(gw * gh);
      for (let y = 0; y <= height; y += 1) {
        for (let x = 0; x <= width; x += 1) {
          let sum = 0;
          if (x > 0 && y > 0) sum += mask[(y - 1) * width + x - 1];
          if (x < width && y > 0) sum += mask[(y - 1) * width + x];
          if (x > 0 && y < height) sum += mask[y * width + x - 1];
          if (x < width && y < height) sum += mask[y * width + x];
          grid[y * gw + x] = sum * 0.25;
        }
      }
      for (let iter = 0; iter < smoothIterations; iter += 1) {
        const next = new Float32Array(grid.length);
        for (let y = 0; y < gh; y += 1) {
          for (let x = 0; x < gw; x += 1) {
            let sum = grid[y * gw + x] * 8;
            let weight = 8;
            for (let oy = -1; oy <= 1; oy += 1) {
              const yy = y + oy;
              if (yy < 0 || yy >= gh) continue;
              for (let ox = -1; ox <= 1; ox += 1) {
                const xx = x + ox;
                if ((ox === 0 && oy === 0) || xx < 0 || xx >= gw) continue;
                const w = ox === 0 || oy === 0 ? 2 : 1;
                sum += grid[yy * gw + xx] * w;
                weight += w;
              }
            }
            next[y * gw + x] = sum / weight;
          }
        }
        grid = next;
      }
      return { grid, gw };
    }

    function buildSvgContourSegments(mask, width, height, bounds, smoothIterations) {
      const { grid, gw } = buildSvgScalarGrid(mask, width, height, smoothIterations);
      const segments = [];
      const limit = smoothIterations + 3;
      const minX = Math.max(0, bounds.minX - limit);
      const minY = Math.max(0, bounds.minY - limit);
      const maxX = Math.min(width - 1, bounds.maxX + limit);
      const maxY = Math.min(height - 1, bounds.maxY + limit);
      const edgePoint = (a, av, b, bv) => {
        const denom = bv - av;
        const t = Math.abs(denom) < 1e-6 ? 0.5 : clamp((0.5 - av) / denom, 0, 1);
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      };
      const push = (a, b) => segments.push([a, b]);
      for (let y = minY; y <= maxY; y += 1) {
        for (let x = minX; x <= maxX; x += 1) {
          const i = y * gw + x;
          const s0 = grid[i], s1 = grid[i + 1], s2 = grid[i + gw + 1], s3 = grid[i + gw];
          const code = (s0 >= 0.5 ? 1 : 0) | (s1 >= 0.5 ? 2 : 0) | (s2 >= 0.5 ? 4 : 0) | (s3 >= 0.5 ? 8 : 0);
          if (code === 0 || code === 15) continue;
          const p0 = [x, y], p1 = [x + 1, y], p2 = [x + 1, y + 1], p3 = [x, y + 1];
          const e01 = edgePoint(p0, s0, p1, s1);
          const e12 = edgePoint(p1, s1, p2, s2);
          const e23 = edgePoint(p2, s2, p3, s3);
          const e30 = edgePoint(p3, s3, p0, s0);
          if (code === 5) {
            push(e30, e01); push(e12, e23);
          } else if (code === 10) {
            push(e01, e12); push(e23, e30);
          } else {
            const map = {
              1: [[e30, e01]], 2: [[e01, e12]], 3: [[e30, e12]], 4: [[e12, e23]],
              6: [[e01, e23]], 7: [[e30, e23]], 8: [[e23, e30]], 9: [[e23, e01]],
              11: [[e23, e12]], 12: [[e12, e30]], 13: [[e12, e01]], 14: [[e01, e30]]
            };
            (map[code] || []).forEach((segment) => push(segment[0], segment[1]));
          }
        }
      }
      return segments;
    }

    function chainSvgSegments(segments) {
      const pointKey = (p) => `${Math.round(p[0] * 10000)}:${Math.round(p[1] * 10000)}`;
      const adjacency = new Map();
      const edges = segments.map(([a, b]) => ({ a, b, ak: pointKey(a), bk: pointKey(b) }));
      const add = (key, edge) => {
        if (!adjacency.has(key)) adjacency.set(key, []);
        adjacency.get(key).push(edge);
      };
      edges.forEach((edge, id) => {
        add(edge.ak, { id, point: edge.b, key: edge.bk });
        add(edge.bk, { id, point: edge.a, key: edge.ak });
      });
      const used = new Uint8Array(edges.length);
      const nextEdge = (key) => {
        const list = adjacency.get(key) || [];
        for (const edge of list) {
          if (!used[edge.id]) return edge;
        }
        return null;
      };
      const paths = [];
      for (let i = 0; i < edges.length; i += 1) {
        if (used[i]) continue;
        used[i] = 1;
        const path = [edges[i].a, edges[i].b];
        let startKey = edges[i].ak;
        let endKey = edges[i].bk;
        for (;;) {
          const edge = nextEdge(endKey);
          if (!edge) break;
          used[edge.id] = 1;
          path.push(edge.point);
          endKey = edge.key;
          if (endKey === startKey) break;
        }
        for (;;) {
          const edge = nextEdge(startKey);
          if (!edge) break;
          used[edge.id] = 1;
          path.unshift(edge.point);
          startKey = edge.key;
        }
        const closed = pointKey(path[0]) === pointKey(path[path.length - 1]);
        if (closed) path.pop();
        if (path.length >= 3) paths.push({ points: path, closed });
      }
      return paths;
    }

    function smoothSvgPath(points, closed, bounds, unit) {
      const toSvg = (p) => [(p[0] - bounds.minX) * unit, (p[1] - bounds.minY) * unit];
      const pts = points.map(toSvg);
      if (pts.length < 3) return "";
      let d = `M${svgNumber(pts[0][0])} ${svgNumber(pts[0][1])}`;
      if (!closed || pts.length < 4) {
        for (let i = 1; i < pts.length; i += 1) d += `L${svgNumber(pts[i][0])} ${svgNumber(pts[i][1])}`;
        return closed ? `${d}Z` : d;
      }
      const n = pts.length;
      for (let i = 0; i < n; i += 1) {
        const p0 = pts[(i - 1 + n) % n];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        const p3 = pts[(i + 2) % n];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += `C${svgNumber(c1[0])} ${svgNumber(c1[1])} ${svgNumber(c2[0])} ${svgNumber(c2[1])} ${svgNumber(p2[0])} ${svgNumber(p2[1])}`;
      }
      return `${d}Z`;
    }

    function buildLineworkSvg() {
      const processed = state.processed;
      if (!processed) throw new Error("请先上传并识别图片");
      const mask = processed.baseMask;
      const bounds = maskBounds(mask, processed.width, processed.height);
      if (!bounds) throw new Error("没有可导出的实体轮廓");
      const unit = 1 / Math.max(1, processed.pixelsPerMm);
      const svgWidth = Math.max(unit, (bounds.maxX - bounds.minX + 1) * unit);
      const svgHeight = Math.max(unit, (bounds.maxY - bounds.minY + 1) * unit);
      const smoothIterations = Math.max(0, Math.round(Number(controls.contourSmooth.value) || 0));
      const segments = buildSvgContourSegments(mask, processed.width, processed.height, bounds, smoothIterations);
      const pathData = chainSvgSegments(segments)
        .map((path) => smoothSvgPath(path.points, path.closed, bounds, unit))
        .filter(Boolean)
        .join(" ");
      const widthText = svgNumber(svgWidth);
      const heightText = svgNumber(svgHeight);
      return [
        `<?xml version="1.0" encoding="UTF-8"?>`,
        `<svg xmlns="http://www.w3.org/2000/svg" width="${widthText}mm" height="${heightText}mm" viewBox="0 0 ${widthText} ${heightText}">`,
        `<title>镂空生成器实体轮廓</title>`,
        `<desc>白色实体轮廓，黑色区域已扣除为镂空</desc>`,
        `<path fill="#eadfc1" fill-rule="evenodd" d="${pathData}"/>`,
        `</svg>`
      ].join("\n");
    }

    const debouncedProcess = debounce(processSource, 260);

    function editorPointFromEvent(event) {
      const processed = state.processed;
      if (!processed) return null;
      const rect = controls.previewPane.getBoundingClientRect();
      const frame = previewFrameFor(rect, processed.width, processed.height);
      const localX = event.clientX - (rect.left || 0);
      const localY = event.clientY - (rect.top || 0);
      const x = (localX - frame.x) / frame.fit;
      const y = (localY - frame.y) / frame.fit;
      if (x < processed.contentX || y < processed.contentY || x > processed.contentX + processed.contentWidth - 1 || y > processed.contentY + processed.contentHeight - 1) return null;
      return {
        x: clamp((x - processed.contentX) / Math.max(1, processed.contentWidth - 1), 0, 1),
        y: clamp((y - processed.contentY) / Math.max(1, processed.contentHeight - 1), 0, 1)
      };
    }

    function processedPixelFromEvent(event) {
      const processed = state.processed;
      if (!processed) return null;
      const rect = controls.previewPane.getBoundingClientRect();
      const frame = previewFrameFor(rect, processed.width, processed.height);
      const localX = event.clientX - (rect.left || 0);
      const localY = event.clientY - (rect.top || 0);
      const x = (localX - frame.x) / frame.fit;
      const y = (localY - frame.y) / frame.fit;
      if (x < 0 || y < 0 || x > processed.width - 1 || y > processed.height - 1) return null;
      return {
        x: clamp(x, 0, processed.width - 1),
        y: clamp(y, 0, processed.height - 1)
      };
    }

    function normalizedProcessedPoint(processed, point) {
      return {
        x: clamp(point.x / Math.max(1, processed.width - 1), 0, 1),
        y: clamp(point.y / Math.max(1, processed.height - 1), 0, 1)
      };
    }

    function findComponentPoint(processed, point, componentValue, radiusMm = 0) {
      const mask = processed.componentMask;
      const width = processed.componentMaskWidth || 0;
      const height = processed.componentMaskHeight || 0;
      if (!mask?.length || !width || !height) return null;
      const scaleX = Math.max(1, width - 1) / Math.max(1, processed.width - 1);
      const scaleY = Math.max(1, height - 1) / Math.max(1, processed.height - 1);
      const centerX = clamp(Math.round(point.x * scaleX), 0, width - 1);
      const centerY = clamp(Math.round(point.y * scaleY), 0, height - 1);
      const pixelsPerMm = Math.max(width / processed.modelWidth, height / processed.modelHeight);
      const radius = Math.max(0, Math.ceil(radiusMm * pixelsPerMm));
      let closest = null;
      for (let y = Math.max(0, centerY - radius); y <= Math.min(height - 1, centerY + radius); y += 1) {
        for (let x = Math.max(0, centerX - radius); x <= Math.min(width - 1, centerX + radius); x += 1) {
          if (mask[y * width + x] !== componentValue) continue;
          const distance = Math.hypot(x - centerX, y - centerY);
          if (distance > radius || (closest && distance >= closest.distance)) continue;
          closest = { x, y, distance };
        }
      }
      if (!closest) return null;
      return {
        x: closest.x / Math.max(1, width - 1) * (processed.width - 1),
        y: closest.y / Math.max(1, height - 1) * (processed.height - 1)
      };
    }

    function commitBaseCutAtEvent(event) {
      const processed = state.processed;
      if (!processed || !controls.baseEnabled.checked) {
        showToast("请先开启镂空底层");
        return false;
      }
      const point = processedPixelFromEvent(event);
      if (!point) return false;
      const seed = findBaseCutSeed(processed, point.x, point.y);
      if (!seed) {
        showToast("这里没有可开孔的底层区域");
        return false;
      }
      recordLineEditHistory();
      state.baseCuts.push({
        kind: "manual",
        x: seed.x / Math.max(1, processed.width - 1),
        y: seed.y / Math.max(1, processed.height - 1)
      });
      rebuildManualLinework();
      showToast("已手动开孔");
      return true;
    }

    function editorScreenPoint(processed, point, rect = controls.previewPane.getBoundingClientRect()) {
      const frame = previewFrameFor(rect, processed.width, processed.height);
      return {
        x: frame.x + (processed.contentX + point.x * (processed.contentWidth - 1)) * frame.fit,
        y: frame.y + (processed.contentY + point.y * (processed.contentHeight - 1)) * frame.fit
      };
    }

    function pointToSegmentDistance(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      const lengthSq = dx * dx + dy * dy;
      if (!lengthSq) return Math.hypot(px - ax, py - ay);
      const t = clamp(((px - ax) * dx + (py - ay) * dy) / lengthSq, 0, 1);
      return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
    }

    function splineHitFromEvent(event) {
      const processed = state.processed;
      if (!processed) return null;
      const rect = controls.previewPane.getBoundingClientRect();
      const pointerX = event.clientX - (rect.left || 0);
      const pointerY = event.clientY - (rect.top || 0);
      let closestPoint = null;
      let closestCurve = null;
      state.lineEdits.forEach((edit, editIndex) => {
        if (edit.kind !== "spline") return;
        edit.points.forEach((point, pointIndex) => {
          const screen = editorScreenPoint(processed, point, rect);
          const distance = Math.hypot(pointerX - screen.x, pointerY - screen.y);
          if (distance <= 13 && (!closestPoint || distance < closestPoint.distance)) {
            closestPoint = { editIndex, pointIndex, distance };
          }
        });
        const curve = sampleSpline(edit.points);
        for (let index = 1; index < curve.length; index += 1) {
          const from = editorScreenPoint(processed, curve[index - 1], rect);
          const to = editorScreenPoint(processed, curve[index], rect);
          const distance = pointToSegmentDistance(pointerX, pointerY, from.x, from.y, to.x, to.y);
          if (distance <= 12 && (!closestCurve || distance < closestCurve.distance)) {
            let insertIndex = 0;
            let controlDistance = Infinity;
            for (let control = 1; control < edit.points.length; control += 1) {
              const controlFrom = editorScreenPoint(processed, edit.points[control - 1], rect);
              const controlTo = editorScreenPoint(processed, edit.points[control], rect);
              const candidate = pointToSegmentDistance(pointerX, pointerY, controlFrom.x, controlFrom.y, controlTo.x, controlTo.y);
              if (candidate < controlDistance) {
                controlDistance = candidate;
                insertIndex = control - 1;
              }
            }
            closestCurve = { editIndex, insertIndex, distance };
          }
        }
      });
      return closestPoint || closestCurve;
    }

    function appendDraftPoint(point) {
      const draft = state.editor.draft;
      if (!draft) return;
      const previous = draft.points[draft.points.length - 1];
      if (!previous || Math.hypot(point.x - previous.x, point.y - previous.y) > 0.0012) draft.points.push(point);
    }

    function commitEditorDraft() {
      const draft = state.editor.draft;
      if (!draft) return false;
      const minimumPoints = draft.kind === "spline" ? 3 : 1;
      if (draft.points.length < minimumPoints) {
        if (draft.kind === "spline") showToast("样条至少需要三个控制点");
        return false;
      }
      recordLineEditHistory();
      state.lineEdits.push({
        kind: draft.kind,
        size: draft.size,
        space: draft.space,
        points: draft.points.map((point) => ({ x: point.x, y: point.y }))
      });
      state.editor.draft = null;
      state.editor.hover = null;
      rebuildManualLinework();
      return true;
    }

      if (state.editor.tool === "baseCut") {
        event.preventDefault();
        commitBaseCutAtEvent(event);
        return;

      if (state.editor.tool === "bridge") {
        const processed = state.processed;
        const pixel = processedPixelFromEvent(event);
        const start = pixel && findComponentPoint(processed, pixel, 2, 0);
        event.preventDefault();
        if (!start) {
          showToast(processed?.solidIslandCount > 0 ? "请从红色孤岛上开始拖动" : "当前没有检测到孤岛");

          space: "processed",
          points: [point, point],
          targetValid: false,
          islandCountBefore: processed.solidIslandCount || 0
        };
        controls.previewCanvas.setPointerCapture?.(event.pointerId);
        renderPreview();
        return;
      }
      const point = editorPointFromEvent(event);

        const hit = splineHitFromEvent(event);
        if (!hit) {
          state.editor.selectedSplineIndex = null;
          renderPreview();
          return;
        }
        state.editor.selectedSplineIndex = hit.editIndex;
        if (hit.pointIndex !== undefined) {
          state.editor.pointDrag = {
            editIndex: hit.editIndex,
            pointIndex: hit.pointIndex,
            before: currentEditSnapshot(),
            changed: false
          };
          controls.previewCanvas.setPointerCapture?.(event.pointerId);
        } else if (event.detail === 2) {
          recordLineEditHistory();
          state.lineEdits[hit.editIndex].points.splice(hit.insertIndex + 1, 0, point);
          rebuildManualLinework();
        }
        renderPreview();
        return;
      }
      if (state.editor.tool === "spline") {
        if (!state.editor.draft || state.editor.draft.kind !== "spline") {
          state.editor.draft = { kind: "spline", size: activeEditorSize(), points: [] };
        }
        if (event.detail === 2) {
          commitEditorDraft();
        } else {
          appendDraftPoint(point);
          state.editor.hover = point;
          renderPreview();
        }
        return;
      }
      state.editor.draft = { kind: state.editor.tool, size: activeEditorSize(), points: [point] };
      controls.previewCanvas.setPointerCapture?.(event.pointerId);
      renderPreview();
    });
    controls.previewCanvas.addEventListener("pointermove", (event) => {
      if (state.previewMode !== "line") return;
      const bridgeDraft = state.editor.draft?.kind === "bridge" ? state.editor.draft : null;
      if (bridgeDraft) {
        const processed = state.processed;
        const pixel = processedPixelFromEvent(event);
        if (!pixel) return;
        const target = findComponentPoint(processed, pixel, 1, Math.max(1.2, bridgeDraft.size));
        bridgeDraft.points[1] = normalizedProcessedPoint(processed, target || pixel);
        bridgeDraft.targetValid = Boolean(target);
        renderPreview();
        return;
      }
      const point = editorPointFromEvent(event);
      const pointDrag = state.editor.pointDrag;
      if (pointDrag) {
        if (!point) return;
        const edit = state.lineEdits[pointDrag.editIndex];
        if (!edit?.points[pointDrag.pointIndex]) return;
        edit.points[pointDrag.pointIndex] = point;
        pointDrag.changed = true;
        renderPreview();
        return;
      }
      const draft = state.editor.draft;
      if (draft?.kind === "spline") {
        state.editor.hover = point;
        renderPreview();
        return;
      }
      if (!draft || !point) return;
      appendDraftPoint(point);
      renderPreview();
    });
    const finishEditorStroke = (event) => {
      const pointDrag = state.editor.pointDrag;
      if (pointDrag) {
        const point = editorPointFromEvent(event);
        if (point) {
          const edit = state.lineEdits[pointDrag.editIndex];
          if (edit?.points[pointDrag.pointIndex]) {
            edit.points[pointDrag.pointIndex] = point;
            pointDrag.changed = true;
          }
        }
        state.editor.pointDrag = null;
        if (pointDrag.changed) {
          recordLineEditHistory(pointDrag.before);
          rebuildManualLinework();
        } else {
          renderPreview();
        }
        if (event?.pointerId !== undefined) controls.previewCanvas.releasePointerCapture?.(event.pointerId);
        return;
      }
      const draft = state.editor.draft;
      if (draft?.kind === "bridge") {
        const processed = state.processed;
        const pixel = processedPixelFromEvent(event);
        const target = pixel && findComponentPoint(processed, pixel, 1, Math.max(1.2, draft.size));
        if (!target) {

          renderPreview();
          showToast("请将连接桥拖到主体后松开");

          return;

        draft.points[1] = normalizedProcessedPoint(processed, target);
        recordLineEditHistory();
        state.lineEdits.push({
          kind: "bridge",
          size: draft.size,
          space: "processed",
          points: draft.points.map((point) => ({ x: point.x, y: point.y }))
        });
        const islandCountBefore = draft.islandCountBefore;
        state.editor.draft = null;
        rebuildManualLinework();

        if (event?.pointerId !== undefined) controls.previewCanvas.releasePointerCapture?.(event.pointerId);
        return;
      }
      if (!draft || draft.kind === "spline") return;
      const point = editorPointFromEvent(event);
      if (point) appendDraftPoint(point);
      commitEditorDraft();
      if (event?.pointerId !== undefined) controls.previewCanvas.releasePointerCapture?.(event.pointerId);
    };

    function applyNumberToRange(range, input, format = false) {
      const value = Number(input.value);
      if (!Number.isFinite(value)) return false;
      const min = Number(range.min);
      if (range === controls.baseMargin && value > Number(range.max)) range.max = String(value);
      const max = Number(range.max);
      const step = Number(range.step) || 1;
      const clamped = clamp(value, min, max);
      const snapped = Math.round((clamped - min) / step) * step + min;
      range.value = String(clamp(Number(snapped.toFixed(6)), min, max));
      if (format) updateLabels();
      return true;
    }

          item.setAttribute("aria-selected", "false");
          item.tabIndex = -1;
        });
        tab.classList.add("active");
        tab.setAttribute("aria-selected", "true");
        tab.tabIndex = 0;
        state.previewMode = tab.dataset.mode;
        updateEditorControls();
        renderPreview();
      });
    });

    const dragState = { active: false, x: 0, y: 0 };
    controls.stage.addEventListener("contextmenu", (event) => {
      if (state.previewMode !== "model") event.preventDefault();
    });
    controls.stage.addEventListener("pointerdown", (event) => {
      if (!controls.stlPane.hidden && controls.stlPane.contains(event.target)) return;
      const panPreview = event.button === 1 || event.button === 2;
      if (state.previewMode !== "model" && !panPreview) return;
      event.preventDefault();
      dragState.active = true;
      dragState.x = event.clientX;
      dragState.y = event.clientY;
      controls.stage.classList.add("dragging");
      controls.stage.setPointerCapture?.(event.pointerId);
    });
    controls.stage.addEventListener("pointermove", (event) => {
      if (!dragState.active) return;
      state.view.x += event.clientX - dragState.x;
      state.view.y += event.clientY - dragState.y;
      dragState.x = event.clientX;
      dragState.y = event.clientY;
      renderPreview();
    });
    const stopDrag = (event) => {
      dragState.active = false;
      controls.stage.classList.remove("dragging");
      if (event?.pointerId !== undefined) controls.stage.releasePointerCapture?.(event.pointerId);
    };
    controls.stage.addEventListener("pointerup", stopDrag);
    controls.stage.addEventListener("pointercancel", stopDrag);
    controls.stage.addEventListener("wheel", (event) => {
      if (!controls.stlPane.hidden && controls.stlPane.contains(event.target)) return;
      event.preventDefault();
      setPreviewZoom(state.view.zoom * Math.exp(-event.deltaY * 0.0012), event.clientX, event.clientY);
    }, { passive: false });
    window.addEventListener("resize", debounce(() => {
      renderPreview();
      renderStlPreview();
    }, 80));
    window.addEventListener("beforeunload", stopWorker);
    setUpResizablePanels();
    updateLabels();
    updatePrintabilityPanel();
    updateExportUi();
    renderPreview();
  </script>

</body>
</html>

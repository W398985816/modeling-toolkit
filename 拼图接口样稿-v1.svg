<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>拼图接口商业化设计样稿 V1</title>
  <desc>A4毫米单位工程评审板，包含经典柔和型、稳固互锁型、儿童大圆角型三套40毫米共享边样稿。</desc>
  <defs>
    <style>
      .page { fill: #f4f0e7; }
      .card { fill: #fbf9f3; stroke: #c9c1b2; stroke-width: .25; }
      .eyebrow { font: 600 2.5px 'IBM Plex Mono', 'Menlo', monospace; letter-spacing: .45px; fill: #96704e; }
      .title { font: 700 6.2px 'Noto Serif SC', 'Songti SC', serif; letter-spacing: .2px; fill: #142c28; }
      .subtitle { font: 400 2.7px 'Noto Serif SC', 'Songti SC', serif; fill: #65716c; }
      .style-name { font: 700 4.4px 'Noto Serif SC', 'Songti SC', serif; fill: #142c28; }
      .style-en { font: 600 2.2px 'IBM Plex Mono', 'Menlo', monospace; letter-spacing: .35px; fill: #96704e; }
      .body { font: 400 2.5px 'Noto Serif SC', 'Songti SC', serif; fill: #4e5c57; }
      .metric { font: 600 2.25px 'IBM Plex Mono', 'Menlo', monospace; fill: #254b44; }
      .tiny { font: 400 2.05px 'Noto Serif SC', 'Songti SC', serif; fill: #6f7772; }
      .dimension { fill: none; stroke: #9a9285; stroke-width: .18; }
      .dimension-text { font: 500 2px 'IBM Plex Mono', 'Menlo', monospace; fill: #756e64; }
      .cutline { fill: none; stroke: #193a34; stroke-width: .18; stroke-dasharray: .8 .55; }
      .gap { fill: none; stroke: #f4f0e7; stroke-width: .30; }
      .piece-line { fill: none; stroke: #17332e; stroke-width: .22; }
      .check { fill: none; stroke: #193a34; stroke-width: .25; }
    </style>
    <marker id="arrow" markerWidth="3" markerHeight="3" refX="1.5" refY="1.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L3,1.5 L0,3 Z" fill="#9a9285"/>
    </marker>
  </defs>

  <rect class="page" width="210" height="297"/>
  <path d="M0 0H210V10H0Z" fill="#153a34"/>
  <circle cx="15" cy="23" r="2" fill="#b68156"/>
  <text x="21" y="21.8" class="eyebrow">JIGSAW INTERFACE / ENGINEERING REVIEW</text>
  <text x="14" y="31" class="title">三种拼接风格 · 1:1 几何样稿</text>
  <text x="14" y="36.2" class="subtitle">A4 · 毫米单位 · 以100%比例打印 · 共享边40 mm · 白色缝隙示意总间隙0.30 mm</text>
  <text x="196" y="30.5" text-anchor="end" class="eyebrow">V1 / CANDIDATE</text>

  <!-- Classic -->
  <g id="classic">
    <rect class="card" x="10" y="44" width="190" height="65" rx="1.2"/>
    <text x="17" y="53" class="style-en">01 / CLASSIC SOFT</text>
    <text x="17" y="59.5" class="style-name">经典柔和型</text>
    <text x="17" y="64.5" class="body">长肩过渡 · 中等腹宽 · 轻微不对称</text>
    <text x="151" y="54" class="metric">D/S  0.18</text>
    <text x="151" y="58.5" class="metric">N/E  0.24</text>
    <text x="151" y="63" class="metric">H/E  0.36</text>
    <text x="151" y="70" class="tiny">默认成人拼图</text>
    <text x="151" y="74" class="tiny">目标：顺滑、自然、低假拼</text>

    <path d="M20 67H80
             L80 75
             C80 78.2 80.6 80.2 82.1 82.8
             C83.2 84.7 83.7 85.3 85.1 84.2
             C87.4 82.4 89 82.8 89.6 86.8
             C90.1 90.1 87.7 93.6 85.1 94.2
             C83.7 95.3 83.2 95.9 82.1 97.8
             C80.6 100.4 80 102.4 80 107
             H20Z" fill="#d8aa7d"/>
    <path d="M140 67H80
             L80 75
             C80 78.2 80.6 80.2 82.1 82.8
             C83.2 84.7 83.7 85.3 85.1 84.2
             C87.4 82.4 89 82.8 89.6 86.8
             C90.1 90.1 87.7 93.6 85.1 94.2
             C83.7 95.3 83.2 95.9 82.1 97.8
             C80.6 100.4 80 102.4 80 107
             H140Z" fill="#7ba49b"/>
    <path class="gap" d="M80 67L80 75 C80 78.2 80.6 80.2 82.1 82.8 C83.2 84.7 83.7 85.3 85.1 84.2 C87.4 82.4 89 82.8 89.6 86.8 C90.1 90.1 87.7 93.6 85.1 94.2 C83.7 95.3 83.2 95.9 82.1 97.8 C80.6 100.4 80 102.4 80 107"/>
    <path class="cutline" d="M80 67L80 75 C80 78.2 80.6 80.2 82.1 82.8 C83.2 84.7 83.7 85.3 85.1 84.2 C87.4 82.4 89 82.8 89.6 86.8 C90.1 90.1 87.7 93.6 85.1 94.2 C83.7 95.3 83.2 95.9 82.1 97.8 C80.6 100.4 80 102.4 80 107"/>
    <path class="piece-line" d="M20 67H80M20 107H80M140 67H80M140 107H80"/>
    <path class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M72 67V107"/>
    <text x="69.5" y="88.5" text-anchor="middle" class="dimension-text" transform="rotate(-90 69.5 88.5)">E = 40 mm</text>
  </g>

  <!-- Secure -->
  <g id="secure">
    <rect class="card" x="10" y="115" width="190" height="65" rx="1.2"/>
    <text x="17" y="124" class="style-en">02 / SECURE HOLD</text>
    <text x="17" y="130.5" class="style-name">稳固互锁型</text>
    <text x="17" y="135.5" class="body">更深腹部 · 明确收颈 · 保持长肩</text>
    <text x="151" y="125" class="metric">D/S  0.22</text>
    <text x="151" y="129.5" class="metric">N/E  0.22</text>
    <text x="151" y="134" class="metric">H/E  0.38</text>
    <text x="151" y="141" class="tiny">适合移动局部拼片组</text>
    <text x="151" y="145" class="tiny">限制：不得形成强制卡扣</text>

    <path d="M20 138H80
             L80 145
             C80 148.6 80.7 150.6 82.3 152.8
             C83.3 154.2 83.5 155.3 85.5 153.7
             C88.4 151.4 90.8 152.8 91.2 156.9
             C91.5 160.5 88.6 164.6 85.5 165.2
             C83.5 163.6 83.3 164.7 82.3 166.1
             C80.7 168.3 80 170.3 80 178
             H20Z" fill="#cb8e69"/>
    <path d="M140 138H80
             L80 145
             C80 148.6 80.7 150.6 82.3 152.8
             C83.3 154.2 83.5 155.3 85.5 153.7
             C88.4 151.4 90.8 152.8 91.2 156.9
             C91.5 160.5 88.6 164.6 85.5 165.2
             C83.5 163.6 83.3 164.7 82.3 166.1
             C80.7 168.3 80 170.3 80 178
             H140Z" fill="#527f77"/>
    <path class="gap" d="M80 138L80 145 C80 148.6 80.7 150.6 82.3 152.8 C83.3 154.2 83.5 155.3 85.5 153.7 C88.4 151.4 90.8 152.8 91.2 156.9 C91.5 160.5 88.6 164.6 85.5 165.2 C83.5 163.6 83.3 164.7 82.3 166.1 C80.7 168.3 80 170.3 80 178"/>
    <path class="cutline" d="M80 138L80 145 C80 148.6 80.7 150.6 82.3 152.8 C83.3 154.2 83.5 155.3 85.5 153.7 C88.4 151.4 90.8 152.8 91.2 156.9 C91.5 160.5 88.6 164.6 85.5 165.2 C83.5 163.6 83.3 164.7 82.3 166.1 C80.7 168.3 80 170.3 80 178"/>
    <path class="piece-line" d="M20 138H80M20 178H80M140 138H80M140 178H80"/>
    <path class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M72 138V178"/>
    <text x="69.5" y="159.5" text-anchor="middle" class="dimension-text" transform="rotate(-90 69.5 159.5)">E = 40 mm</text>
  </g>

  <!-- Child -->
  <g id="child">
    <rect class="card" x="10" y="186" width="190" height="65" rx="1.2"/>
    <text x="17" y="195" class="style-en">03 / CHILD ROUND</text>
    <text x="17" y="201.5" class="style-name">儿童大圆角型</text>
    <text x="17" y="206.5" class="body">宽颈浅咬合 · 大圆角 · 低应力集中</text>
    <text x="151" y="196" class="metric">D/S  0.14</text>
    <text x="151" y="200.5" class="metric">N/E  0.30</text>
    <text x="151" y="205" class="metric">H/E  0.40</text>
    <text x="151" y="212" class="tiny">用于低片数和大拼片</text>
    <text x="151" y="216" class="tiny">优先：耐用、易握、易拆装</text>

    <path d="M20 209H80
             L80 217
             C80 220.5 80.5 222.4 81.8 224.7
             C82.8 226.5 83.5 227.1 85.2 226.5
             C87.4 225.7 88.7 227.4 88.7 229
             C88.7 231.8 87.3 233.5 85.2 233.8
             C83.5 233.2 82.8 233.8 81.8 235.6
             C80.5 237.9 80 239.8 80 249
             H20Z" fill="#deb778"/>
    <path d="M140 209H80
             L80 217
             C80 220.5 80.5 222.4 81.8 224.7
             C82.8 226.5 83.5 227.1 85.2 226.5
             C87.4 225.7 88.7 227.4 88.7 229
             C88.7 231.8 87.3 233.5 85.2 233.8
             C83.5 233.2 82.8 233.8 81.8 235.6
             C80.5 237.9 80 239.8 80 249
             H140Z" fill="#8fa986"/>
    <path class="gap" d="M80 209L80 217 C80 220.5 80.5 222.4 81.8 224.7 C82.8 226.5 83.5 227.1 85.2 226.5 C87.4 225.7 88.7 227.4 88.7 229 C88.7 231.8 87.3 233.5 85.2 233.8 C83.5 233.2 82.8 233.8 81.8 235.6 C80.5 237.9 80 239.8 80 249"/>
    <path class="cutline" d="M80 209L80 217 C80 220.5 80.5 222.4 81.8 224.7 C82.8 226.5 83.5 227.1 85.2 226.5 C87.4 225.7 88.7 227.4 88.7 229 C88.7 231.8 87.3 233.5 85.2 233.8 C83.5 233.2 82.8 233.8 81.8 235.6 C80.5 237.9 80 239.8 80 249"/>
    <path class="piece-line" d="M20 209H80M20 249H80M140 209H80M140 249H80"/>
    <path class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M72 209V249"/>
    <text x="69.5" y="230.5" text-anchor="middle" class="dimension-text" transform="rotate(-90 69.5 230.5)">E = 40 mm</text>
  </g>

  <!-- Footer calibration references -->
  <g id="calibration-reference">
    <text x="14" y="262" class="eyebrow">FIT CALIBRATION / TOTAL GAP</text>
    <text x="14" y="267" class="tiny">正式开发需生成独立STL校准条；以下仅为1:1线宽参照，不替代实物装配测试。</text>
    <g transform="translate(14 273)">
      <rect x="0" y="0" width="32" height="8" rx=".8" fill="#d9d2c5"/>
      <path d="M16 0V8" stroke="#f4f0e7" stroke-width=".2"/>
      <text x="16" y="12" text-anchor="middle" class="dimension-text">0.20 mm</text>
      <rect x="38" y="0" width="32" height="8" rx=".8" fill="#d9d2c5"/>
      <path d="M54 0V8" stroke="#f4f0e7" stroke-width=".3"/>
      <text x="54" y="12" text-anchor="middle" class="dimension-text">0.30 mm</text>
      <rect x="76" y="0" width="32" height="8" rx=".8" fill="#d9d2c5"/>
      <path d="M92 0V8" stroke="#f4f0e7" stroke-width=".4"/>
      <text x="92" y="12" text-anchor="middle" class="dimension-text">0.40 mm</text>
      <path class="check" d="M120 0H170M120 8H170"/>
      <path class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M120 4H170"/>
      <text x="145" y="12" text-anchor="middle" class="dimension-text">比例检查 50 mm</text>
    </g>
  </g>
</svg>
